[package]
name = "monitorflow-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "monitorflow-relay"
path = "src/main.rs"

[dependencies]
monitorflow-common = { workspace = true, features = ["mirror"] }
# Self-update (ADR-0055): the agent's command dispatcher, download, root
# helper and watchdog, run for the relay's own binary and unit.
monitorflow-agent = { path = "../agent" }
# Network checks run as a probe (ADR-0148).
monitorflow-probe.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
thiserror.workspace = true
rustls.workspace = true
x509-parser.workspace = true
prost.workspace = true
crc.workspace = true
reqwest.workspace = true
serde_json.workspace = true
ring.workspace = true
serde.workspace = true
# The disk size the default cap of on-demand packages is half of.
rustix.workspace = true
# The addresses a relay reports for confirmation (ADR-0066).
if-addrs.workspace = true

[dev-dependencies]
# The fake distribution of the on-demand cascade test.
axum.workspace = true
monitorflow-server = { path = "../server" }
async-trait.workspace = true
rcgen.workspace = true
tempfile.workspace = true
sqlx.workspace = true
pem.workspace = true
uuid.workspace = true
# The test upstream's compressed metadata; the xz encoder for fixtures only.
flate2.workspace = true
ruzstd.workspace = true
bzip2.workspace = true
lzma-rust2 = { workspace = true, features = ["encoder"] }

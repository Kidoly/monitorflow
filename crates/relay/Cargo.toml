[package]
name = "monitorflow-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "monitorflow-relay"
path = "src/main.rs"

[dependencies]
monitorflow-common = { workspace = true, features = ["mirror"] }
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
thiserror.workspace = true
rustls.workspace = true
x509-parser.workspace = true
prost.workspace = true
crc.workspace = true
reqwest.workspace = true
serde_json.workspace = true
percent-encoding.workspace = true
ring.workspace = true
serde.workspace = true
flate2.workspace = true
ruzstd.workspace = true
lzma-rust2.workspace = true
bzip2.workspace = true
quick-xml.workspace = true

[dev-dependencies]
monitorflow-server = { path = "../server" }
rcgen.workspace = true
tempfile.workspace = true
sqlx.workspace = true
pem.workspace = true
uuid.workspace = true
# The xz encoder writes the tests' fixtures only.
lzma-rust2 = { workspace = true, features = ["encoder"] }

[package]
name = "monitorflow-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "monitorflow-agent"
path = "src/main.rs"

[dependencies]
monitorflow-common.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
async-trait.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
# Creation times of LVM snapshots (ADR-0094).
chrono.workspace = true
toml.workspace = true
# `ai-commands on|off` edits agent.toml, keeping its comments (ADR-0084).
toml_edit.workspace = true
thiserror.workspace = true
monitorflow-sensors.workspace = true
# Website checks (ADR-0150).
monitorflow-webcheck.workspace = true
# Ready-made application checks (ADR-0183).
monitorflow-apps.workspace = true
# Check plugins in their sandbox (ADR-0103).
monitorflow-plugin.workspace = true
prost.workspace = true
ring.workspace = true
base64.workspace = true
# Downloads releases for self-update (ADR-0053): the system's roots for
# self-hosted copies, the bundled ones for GitHub.
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }

[target.'cfg(unix)'.dependencies]
# Pseudo-terminals of remote terminals (ADR-0190).
rustix = { workspace = true, features = ["process", "pty", "termios", "stdio"] }

[target.'cfg(windows)'.dependencies]
# Service control manager and OS version (ADR-0047); the service's
# fatal error in the Event Log (ADR-0050).
windows-service.workspace = true
windows-registry.workspace = true
# Windows Update calls and the update service's pipe (ADR-0049).
windows.workspace = true
# Pseudo consoles of remote terminals (ADR-0190).
windows-sys = { workspace = true, features = ["Win32_System_EventLog", "Win32_System_Pipes", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
rcgen.workspace = true
# Test plugins in the WebAssembly text format.
wat = "1"
monitorflow-sensors = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
pem.workspace = true
uuid.workspace = true

# The integration tests run a real server, which only builds on Unix.
[target.'cfg(unix)'.dev-dependencies]
monitorflow-server = { path = "../server" }
sqlx.workspace = true
# For the fake VictoriaMetrics shared with the server's tests.
axum.workspace = true
# The fake RDP service of the remote desktop test speaks TLS.
tokio-rustls.workspace = true

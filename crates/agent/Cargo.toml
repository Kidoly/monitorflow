[package]
name = "monitorflow-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "monitorflow-agent"
path = "src/main.rs"

[dependencies]
monitorflow-common.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
async-trait.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
monitorflow-sensors.workspace = true
prost.workspace = true
ring.workspace = true
base64.workspace = true
# Downloads releases for self-update (ADR-0053): the system's roots for
# self-hosted copies, the bundled ones for GitHub.
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
# Service control manager and OS version (ADR-0047); the service's
# fatal error in the Event Log (ADR-0050).
windows-service.workspace = true
windows-registry.workspace = true
# Windows Update calls and the update service's pipe (ADR-0049).
windows.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_EventLog"] }

[dev-dependencies]
rcgen.workspace = true
monitorflow-sensors = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
pem.workspace = true
uuid.workspace = true

# The integration tests run a real server, which only builds on Unix.
[target.'cfg(unix)'.dev-dependencies]
monitorflow-server = { path = "../server" }
sqlx.workspace = true
# For the fake VictoriaMetrics shared with the server's tests.
axum.workspace = true

[package]
name = "monitorflow-common"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tonic.workspace = true
prost.workspace = true
prost-types.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
ring.workspace = true
base64.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
hyper-util.workspace = true
tower.workspace = true
x509-parser.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rcgen.workspace = true
# The mirror listener and its index (feature `mirror`).
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
# Serving mirror content (ADR-0030, ADR-0034), for the server and relays.
mirror = ["dep:axum", "dep:tower-http", "dep:percent-encoding", "dep:serde_json"]

[dev-dependencies]
pem.workspace = true
tempfile.workspace = true
reqwest.workspace = true

[build-dependencies]
tonic-build.workspace = true

[[test]]
name = "mirror_serve"
required-features = ["mirror"]

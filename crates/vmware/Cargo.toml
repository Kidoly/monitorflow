[package]
name = "monitorflow-vmware"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "vCenter and ESXi checks through the vSphere API, run from a probe (ADR-0156)"

# A sensor of `monitorflow-sensors`, kept apart so agents do not carry a
# SOAP client.

[dependencies]
monitorflow-sensors.workspace = true
# The certificate verifier pinned by fingerprint, shared with Jolokia's.
monitorflow-common.workspace = true
async-trait.workspace = true
chrono.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
http-body-util.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true, features = ["server", "http1"] }
rcgen.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls.workspace = true

[package]
name = "monitorflow-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "monitorflow-server"
path = "src/main.rs"

[dependencies]
# server-update: checks and requests of server updates (ADR-0056).
monitorflow-common = { workspace = true, features = ["mirror", "server-update"] }
monitorflow-sensors.workspace = true
# AI remediation loop (ADR-0039, ADR-0043).
monitorflow-ai.workspace = true
base64.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
rustls.workspace = true
thiserror.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
axum.workspace = true
# Agent release files behind the web interface (ADR-0054).
tower-http.workspace = true
argon2.workspace = true
rpassword.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
# CSR parsing and signature verification need rcgen's x509-parser feature.
rcgen = { workspace = true, features = ["x509-parser"] }
ring.workspace = true
pem.workspace = true
time.workspace = true
x509-parser.workspace = true
prost.workspace = true
reqwest.workspace = true
snap.workspace = true
async-trait.workspace = true
# Secret redaction of AI context (ADR-0040).
regex.workspace = true
# Kills a timed-out mirror tool with the programs it started.
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
tower.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
monitorflow-sensors = { workspace = true, features = ["testing"] }
monitorflow-ai = { workspace = true, features = ["testing"] }

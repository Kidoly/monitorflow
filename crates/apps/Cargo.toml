[package]
name = "monitorflow-apps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Ready-made application checks: PostgreSQL, MySQL and MariaDB, Redis, Docker, Kubernetes (ADR-0183)"

# Sensors of `monitorflow-sensors` kept apart, as they speak the
# applications' own protocols: database clients and HTTP over the Docker
# socket stay out of `monitorflow-sensors` (ADR-0021), as does the HTTPS
# client of the Kubernetes API.

[dependencies]
monitorflow-sensors.workspace = true
async-trait.workspace = true
base64.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
# PostgreSQL and MySQL clients, over rustls like the rest of the workspace.
sqlx = { workspace = true, features = ["mysql"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
webpki-roots.workspace = true
x509-parser.workspace = true

[dev-dependencies]
http-body-util.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true, features = ["server", "http1"] }
rcgen.workspace = true
tokio-rustls.workspace = true
tokio = { workspace = true, features = ["test-util"] }

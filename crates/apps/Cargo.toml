[package]
name = "monitorflow-apps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Ready-made application checks: PostgreSQL, MySQL and MariaDB, SQL Server, Redis, JMX, Docker, Kubernetes (ADR-0183)"

# Sensors of `monitorflow-sensors` kept apart, as they speak the
# applications' own protocols: database clients and HTTP over the Docker
# socket stay out of `monitorflow-sensors` (ADR-0021), as does the HTTPS
# client of the Kubernetes API.

[dependencies]
monitorflow-sensors.workspace = true
# The certificate verifier pinned by fingerprint, shared with vCenter's
# (Jolokia over HTTPS, ADR-0183).
monitorflow-common.workspace = true
async-trait.workspace = true
base64.workspace = true
regex.workspace = true
# Jolokia's HTTP bridge to JMX, over rustls on ring, the machine's roots
# for `tls` `verify`.
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
# PostgreSQL and MySQL clients, over rustls like the rest of the workspace.
sqlx = { workspace = true, features = ["mysql"] }
# SQL Server's TDS encryption, on ring like the rest of the workspace.
rustls = { workspace = true, features = ["tls12"] }
rustls-native-certs.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
x509-parser.workspace = true

# SSPI, for signing in to SQL Server with a Windows account.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_System_Rpc",
] }

[dev-dependencies]
http-body-util.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true, features = ["server", "http1"] }
rcgen.workspace = true
tokio-rustls.workspace = true
tokio = { workspace = true, features = ["test-util"] }

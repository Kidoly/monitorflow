      value: ^(?:automatic|automatic delayed)$
    - macro: '{$SERVICE.STARTUPNAME.NOT_MATCHES}'
      value: ^(?:manual|disabled)$
    - macro: '{$SWAP.PFREE.MIN.WARN}'
      value: '20'
    - macro: '{$VFS.DEV.DEVNAME.MATCHES}'
      value: .*
    - macro: '{$VFS.DEV.DEVNAME.NOT_MATCHES}'
      value: _Total
    - macro: '{$VFS.DEV.READ.AWAIT.WARN}'
      value: '0.02'
    - macro: '{$VFS.DEV.UTIL.MAX.WARN}'
      value: '95'
    - macro: '{$VFS.DEV.WRITE.AWAIT.WARN}'
      value: '0.02'
    - macro: '{$VFS.FS.FSDRIVETYPE.MATCHES}'
      value: fixed
    - macro: '{$VFS.FS.FSDRIVETYPE.NOT_MATCHES}'
      value: ^\s$
    - macro: '{$VFS.FS.FSNAME.MATCHES}'
      value: .*
    - macro: '{$VFS.FS.FSNAME.NOT_MATCHES}'
      value: ^(?:/dev|/sys|/run|/proc|.+/shm$)
    - macro: '{$VFS.FS.FSTYPE.MATCHES}'
      value: .*
    - macro: '{$VFS.FS.FSTYPE.NOT_MATCHES}'
      value: ^\s$
    - macro: '{$VFS.FS.PUSED.MAX.CRIT}'
      value: '90'
    - macro: '{$VFS.FS.PUSED.MAX.WARN}'
      value: '80'
  # The VMware template's items and datastore space triggers (ADR-0156),
  # written from the template Zabbix 7.0 publishes rather than exported.
  - template: VMware
    name: VMware
    items:
    - name: VMware Full name
      type: SIMPLE
      key: vmware.fullname[{$VMWARE.URL}]
      delay: 1h
    - name: VMware Version
      type: SIMPLE
      key: vmware.version[{$VMWARE.URL}]
      delay: 1h
    discovery_rules:
    - name: Discover VMware datastores
      type: SIMPLE
      key: vmware.datastore.discovery[{$VMWARE.URL}]
      delay: 1h
      item_prototypes:
      - name: 'VMware: Free space in percentage on datastore {#DATASTORE}'
        type: SIMPLE
        key: vmware.datastore.size[{$VMWARE.URL},{#DATASTORE.UUID},pfree]
        trigger_prototypes:
        - expression: last(/VMware/vmware.datastore.size[{$VMWARE.URL},{#DATASTORE.UUID},pfree])<{$VMWARE.DATASTORE.SPACE.CRIT}
          name: 'VMware: [{#DATASTORE}]: Free space is critically low'
          priority: HIGH
        - expression: last(/VMware/vmware.datastore.size[{$VMWARE.URL},{#DATASTORE.UUID},pfree])<{$VMWARE.DATASTORE.SPACE.WARN}
          name: 'VMware: [{#DATASTORE}]: Free space is low'
          priority: WARNING
    macros:
    - macro: '{$VMWARE.DATASTORE.SPACE.CRIT}'
      value: '10'
    - macro: '{$VMWARE.DATASTORE.SPACE.WARN}'
      value: '20'
  triggers:
  - expression: last(/Linux by Zabbix agent/proc.num)/last(/Linux by Zabbix agent/kernel.maxproc)*100>80
    name: 'Linux: Getting closer to process limit'
    priority: WARNING
  - expression: last(/Linux by Zabbix agent active/proc.num)/last(/Linux by Zabbix agent active/kernel.maxproc)*100>80
    name: 'Linux: Getting closer to process limit'
    priority: WARNING
  - expression: max(/Linux by Zabbix agent/system.swap.size[,pfree],5m)<{$SWAP.PFREE.MIN.WARN} and last(/Linux by Zabbix agent/system.swap.size[,total])>0
    name: 'Linux: High swap space usage'
    priority: WARNING
  - expression: max(/Linux by Zabbix agent active/system.swap.size[,pfree],5m)<{$SWAP.PFREE.MIN.WARN} and last(/Linux by Zabbix agent active/system.swap.size[,total])>0
    name: 'Linux: High swap space usage'
    priority: WARNING
  - expression: max(/Linux by Zabbix agent/vm.memory.size[available],5m)<{$MEMORY.AVAILABLE.MIN} and last(/Linux by Zabbix agent/vm.memory.size[total])>0
    name: 'Linux: Lack of available memory'
    priority: AVERAGE
  - expression: max(/Linux by Zabbix agent active/vm.memory.size[available],5m)<{$MEMORY.AVAILABLE.MIN} and last(/Linux by Zabbix agent active/vm.memory.size[total])>0
    name: 'Linux: Lack of available memory'
    priority: AVERAGE
  - expression: |
      min(/Linux by Zabbix agent/system.cpu.load[all,avg1],5m)/last(/Linux by Zabbix agent/system.cpu.num)>{$LOAD_AVG_PER_CPU.MAX.WARN}
      and last(/Linux by Zabbix agent/system.cpu.load[all,avg5])>0
      and last(/Linux by Zabbix agent/system.cpu.load[all,avg15])>0
    name: 'Linux: Load average is too high'
    priority: AVERAGE
  - expression: |
      min(/Linux by Zabbix agent active/system.cpu.load[all,avg1],5m)/last(/Linux by Zabbix agent active/system.cpu.num)>{$LOAD_AVG_PER_CPU.MAX.WARN}
      and last(/Linux by Zabbix agent active/system.cpu.load[all,avg5])>0
      and last(/Linux by Zabbix agent active/system.cpu.load[all,avg15])>0
    name: 'Linux: Load average is too high'
    priority: AVERAGE
  - expression: min(/Windows by Zabbix agent/perf_counter_en["\System\Processor Queue Length"],5m) - last(/Windows by Zabbix agent/wmi.get[root/cimv2,"Select NumberOfLogicalProcessors from Win32_ComputerSystem"]) * 2 > {$CPU.QUEUE.CRIT.MAX}
    name: 'Windows: CPU queue length is too high'
    priority: WARNING
  - expression: min(/Windows by Zabbix agent active/perf_counter_en["\System\Processor Queue Length"],5m) - last(/Windows by Zabbix agent active/wmi.get[root/cimv2,"Select NumberOfLogicalProcessors from Win32_ComputerSystem"]) * 2 > {$CPU.QUEUE.CRIT.MAX}
    name: 'Windows: CPU queue length is too high'
    priority: WARNING
  - expression: max(/Windows by Zabbix agent/system.swap.pfree,5m)<{$SWAP.PFREE.MIN.WARN} and last(/Windows by Zabbix agent/system.swap.size[,total])>0
    name: 'Windows: High swap space usage'
    priority: WARNING
  - expression: max(/Windows by Zabbix agent active/system.swap.pfree,5m)<{$SWAP.PFREE.MIN.WARN} and last(/Windows by Zabbix agent active/system.swap.size[,total])>0
    name: 'Windows: High swap space usage'
    priority: WARNING

# Blackbox exporter modules of the import test stack.
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: []
      method: GET
      preferred_ip_protocol: ip4
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
  dns_shop:
    prober: dns
    timeout: 5s
    dns:
      query_name: shop
      query_type: A
      transport_protocol: udp
      preferred_ip_protocol: ip4

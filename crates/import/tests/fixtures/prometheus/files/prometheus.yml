# Prometheus of the import test stack (deploy/import-test/prometheus):
# node exporters, a blackbox exporter, static targets and file service
# discovery, the way a small real setup looks.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: import-test

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Machines: web-01 here, the others from files.
  - job_name: node
    static_configs:
      - targets: ["web-01:9100"]
        labels:
          env: production
          role: web
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/nodes-*.json
        refresh_interval: 1m

  # The blackbox exporter's own metrics.
  - job_name: blackbox-exporter
    scrape_interval: 30s
    static_configs:
      - targets: ["monitor-01:9115"]

  # Web sites, through the blackbox exporter on monitor-01.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/probes-http.yml
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: monitor-01:9115

  # TCP ports.
  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["shop:80", "db-01:9100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: monitor-01:9115

  # Pings.
  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: ["db-01"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: monitor-01:9115

  # Name resolution, against Docker's resolver.
  - job_name: blackbox-dns
    metrics_path: /probe
    params:
      module: [dns_shop]
    static_configs:
      - targets: ["127.0.0.11"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: monitor-01:9115

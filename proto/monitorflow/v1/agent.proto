// MonitorFlow agent protocol, version 1.
//
// Rules: changes are additive only. Never renumber or reuse a field number.
// Add new message kinds as new `oneof` variants of Envelope.

syntax = "proto3";

package monitorflow.v1;

import "monitorflow/v1/inventory.proto";
import "monitorflow/v1/packages.proto";

// Long-lived bidirectional stream between an agent (or relay) and its upstream.
service AgentService {
  rpc Stream(stream Envelope) returns (stream Envelope);
}

// Every message on the stream is wrapped in an Envelope.
message Envelope {
  // Monotonic per sender, used for ordering and deduplication after reconnects.
  uint64 sequence = 1;

  oneof payload {
    Hello hello = 10;
    Heartbeat heartbeat = 11;
    SampleBatch samples = 12;
    SensorConfig sensor_config = 13;
    SensorConfigAck sensor_config_ack = 14;
    // Agent to server: installed packages and reboot state (ADR-0031).
    PackageReport package_report = 15;
    // Relay to server, on the relay's own stream: the mirrors it serves to
    // its agents (ADR-0037).
    RelayMirrors relay_mirrors = 16;
    // Agent to server: system log lines (ADR-0091).
    LogBatch logs = 17;
    // Agent to server: what runs on the machine, for check
    // recommendations (ADR-0134).
    DiscoveryReport discovery = 18;
    // Server to relay, on the relay's own stream: the network checks it
    // runs as a probe (ADR-0148).
    ProbeConfig probe_config = 19;
    // Relay to server, on its own stream: what its probe checks measured.
    ProbeResults probe_results = 22;
    // Relay to server, on its own stream, once it applied a ProbeConfig.
    ProbeConfigAck probe_config_ack = 23;
    // Server to relay, on the relay's own stream: run one check once now,
    // to see what a device answers before adding it (ADR-0149).
    ProbeTest probe_test = 24;
    // Relay to server: what that check measured.
    ProbeTestResult probe_test_result = 25;
    // Relay to server, on its own stream: what the flows its exporters
    // sent added up to, a window at a time (ADR-0184).
    FlowReports flow_reports = 26;
    // Both ways, on an agent's stream: the frames of a remote session
    // (ADR-0190), sealed end to end between the central server and the
    // agent, so relays pass them on without reading or changing them.
    RemoteFrame remote = 27;
    // Agent to server: what the machine is made of and runs (ADR-0187).
    InventoryReport inventory = 28;
    // Server to agent: send the inventory again (ADR-0187).
    InventoryRequest inventory_request = 29;
    Command command = 20;
    CommandResult command_result = 21;
  }
}

// First message sent by an agent on a new stream.
message Hello {
  string agent_id = 1;
  string protocol_version = 2;
  string agent_version = 3;
  string hostname = 4;
  // "debian", "rhel" or "windows": the package family, which decides the
  // mirror type. "linux" for any other distribution, which gets monitoring
  // only (ADR-0063).
  string os_family = 5;
  // Distribution and version, from /etc/os-release, like "debian 12".
  string os_version = 6;
  // No package manager the agent can drive on this host, even in a known
  // family: updates and sources are unavailable. Agents before ADR-0063
  // leave it false, and they all have one.
  bool no_package_manager = 7;
  // What the agent does with each kind of command, from the handlers it
  // runs (ADR-0076). Empty means not reported: agents before ADR-0076, or
  // a relay before it on the way, which drops this field. It says nothing
  // about whether the agent would accept a command.
  repeated CommandKindState command_kinds = 8;
  // The SMBIOS system UUID, lowercase, which Proxmox calls a VM's
  // `smbios1` uuid. Empty when unreadable, and inside containers, which
  // see their host's (ADR-0093).
  string system_uuid = 9;
  // MAC addresses of the network interfaces, lowercase `aa:bb:cc:dd:ee:ff`,
  // loopback and all-zero ones left out. Empty when not reported.
  repeated string mac_addresses = 10;
}

message Heartbeat {
  int64 sent_at_unix_ms = 1;
}

// A single sensor reading.
message Sample {
  string sensor = 1;
  string instance = 2;        // e.g. mount point, unit name, core index
  int64 timestamp_unix_ms = 3;
  double value = 4;
  map<string, string> labels = 5;
}

message SampleBatch {
  repeated Sample samples = 1;
}

// System log lines an agent forwards (ADR-0091), oldest first.
message LogBatch {
  repeated LogEntry entries = 1;
  // Lines the agent dropped since its previous batch because they came
  // faster than its rate limit allows.
  uint64 rate_limited = 2;
}

message LogEntry {
  int64 timestamp_unix_ms = 1;
  string message = 2;
  // syslog priority: 0 emergency to 7 debug.
  uint32 priority = 3;
  // The systemd unit, like "nginx.service"; empty when there is none.
  string unit = 4;
  // The syslog identifier, like "sshd" or "kernel".
  string identifier = 5;
  // The journal's boot ID, 32 hex digits.
  string boot_id = 6;
  uint32 pid = 7;
  // Where the line comes from: "journal".
  string source = 8;
}

// What an agent sees running on its machine, for the server to recommend
// checks (ADR-0134). Sent when it changes and at least every hour; each
// report replaces the previous one. Untrusted: the server bounds and
// checks every field. Older relays drop it, as they drop any payload they
// do not know.
message DiscoveryReport {
  int64 collected_at_unix_ms = 1;
  // Running systemd services, like "nginx.service" or
  // "postgresql@16-main.service". At most 256.
  repeated string services = 2;
  // Listening TCP ports. At most 128.
  repeated DiscoveredPort ports = 3;
  // Mounted file systems that hold data. At most 64.
  repeated DiscoveredMount mounts = 4;
}

message DiscoveredPort {
  uint32 port = 1;
  // Every socket on it listens on a loopback address only.
  bool loopback_only = 2;
  // A socket listens on a loopback or wildcard address, so a check on
  // 127.0.0.1 reaches it.
  bool local = 3;
}

message DiscoveredMount {
  string path = 1;
  // Like "ext4", "nfs4" or "cifs".
  string fs_type = 2;
  // The file server of a network share, like "nas.lan"; empty otherwise.
  string source_host = 3;
}

// Sensors an agent must run, sent by the server after a valid Hello and
// again whenever the configuration changes (ADR-0016). Replaces the whole
// previous configuration.
message SensorConfig {
  // Grows with every change of the server's configuration in the database.
  uint64 revision = 1;
  repeated SensorSpec sensors = 2;
  // The check plugins the sensors of kind "plugin" name (ADR-0103).
  repeated PluginGrant plugins = 3;
  // The server's signature of `plugins` as a whole, with when it was made.
  // Absent from servers older than it.
  PluginGrantSet plugin_set = 4;
}

// Which check plugins an agent may run now (ADR-0103): signed with the
// command key over the agent's ID, both times, and the name and package
// SHA-256 of every grant of the configuration, in order
// (`common::plugin_grant`). An agent runs the plugins of the newest set it
// has seen and of no older one, so a relay cannot bring back a plugin that
// was updated, turned off or removed, and an empty set says there is none.
message PluginGrantSet {
  int64 issued_at_unix_ms = 1;
  int64 expires_at_unix_ms = 2;
  bytes signature = 3;
}

// A check plugin an agent may run (ADR-0103): its package as its publisher
// signed it, and the server's grant, signed with the command key over the
// agent's ID, the plugin's name and the package's SHA-256
// (`common::plugin_grant`), so that a relay cannot add one.
message PluginGrant {
  string name = 1;
  bytes package = 2;
  bytes signature = 3;
}

// One configured sensor; (name, instance) is unique within a SensorConfig.
message SensorSpec {
  // Implementation to run, like "cpu" or "port".
  string kind = 1;
  // Sensor name: the metric name on the server (ADR-0013).
  string name = 2;
  string instance = 3;
  uint64 interval_ms = 4;
  // 0 means the agent's default timeout, capped by the interval.
  uint64 timeout_ms = 5;
  // Kind-specific parameters.
  map<string, string> params = 6;
}

// Sent by an agent once it applied a SensorConfig, valid or not.
message SensorConfigAck {
  uint64 revision = 1;
  // Specs the agent refused; the others run.
  repeated SensorSpecError errors = 2;
}

message SensorSpecError {
  string name = 1;
  string instance = 2;
  string message = 3;
}

// The network checks a relay runs as a probe (ADR-0148): pings, ports and
// SNMP of addresses of its site, each for one server or device of the
// central server's inventory. Sent after the relay's Hello and whenever it
// changes; replaces the whole previous one. Older relays drop it.
message ProbeConfig {
  // Changes whenever the checks change.
  uint64 revision = 1;
  repeated ProbeCheck checks = 2;
  // The devices whose NetFlow, IPFIX and sFlow the relay receives
  // (ADR-0184); none: it opens no flow listener.
  repeated FlowExporter flow_exporters = 3;
}

// A device that sends traffic flows to the probe.
message FlowExporter {
  // `ProbeCheck.device`: its ID in the inventory.
  string device = 1;
  // Addresses its flows come from: IP addresses, or DNS names the relay
  // resolves. A datagram from another address is dropped.
  repeated string addresses = 2;
}

// Flows added up per exporter and window, oldest first.
message FlowReports {
  repeated FlowReport reports = 1;
}

// One exporter's traffic over one window: the totals, the largest keys of
// each dimension, and the largest conversations. The rest of a dimension
// is the total minus its keys.
message FlowReport {
  // `FlowExporter.device`.
  string device = 1;
  // Start of the window, aligned on its length.
  int64 start_unix_ms = 2;
  uint32 seconds = 3;
  // Bytes and packets of the window, sampling already undone.
  uint64 bytes = 4;
  uint64 packets = 5;
  repeated FlowTop tops = 6;
  repeated FlowConversation conversations = 7;
}

message FlowTop {
  // `src`, `dst` (addresses), `app` (`tcp/443`), `protocol` (`tcp`),
  // `in` or `out` (the exporter's ifIndex).
  string dimension = 1;
  string key = 2;
  uint64 bytes = 3;
  uint64 packets = 4;
}

message FlowConversation {
  string src = 1;
  string dst = 2;
  string app = 3;
  uint32 input = 4;
  uint32 output = 5;
  uint64 bytes = 6;
  uint64 packets = 7;
}

message ProbeCheck {
  // The server or device the results belong to: its ID in the inventory.
  string device = 1;
  // What to run; (device, name, instance) is unique within a ProbeConfig.
  SensorSpec spec = 2;
}

// Sent by a relay once it applied a ProbeConfig, valid or not.
message ProbeConfigAck {
  uint64 revision = 1;
  repeated ProbeCheckError errors = 2;
}

message ProbeCheckError {
  string device = 1;
  string name = 2;
  string instance = 3;
  string message = 4;
}

// What a relay's probe checks measured, oldest first.
message ProbeResults {
  repeated DeviceSamples devices = 1;
}

message DeviceSamples {
  // `ProbeCheck.device`: the server only accepts devices of the
  // configuration it sent this relay.
  string device = 1;
  repeated Sample samples = 2;
}

// One check to run once, right away, outside the relay's configuration.
message ProbeTest {
  // Chosen by the server; the result names it.
  string id = 1;
  ProbeCheck check = 2;
}

message ProbeTestResult {
  string id = 1;
  repeated Sample samples = 2;
  // Why the check could not run or failed; empty when it ran.
  string error = 3;
}

// What a relay's mirror listener serves, sent after its Hello and again
// whenever it changes (ADR-0037). Replaces the previous report.
message RelayMirrors {
  // Base URL the relay's agents reach its mirror listener at, from the
  // relay's `mirror.public_url`. Empty when the relay serves no mirrors.
  string public_url = 1;
  repeated ServedMirror mirrors = 2;
}

message ServedMirror {
  // "apt" or "dnf".
  string family = 1;
  string name = 2;
  // Snapshot `current` names; empty when there is none.
  string current = 3;
  // Complete snapshots the relay holds, `current` included.
  repeated string snapshots = 4;
}

// A command from the central server. Always signed; agents verify before
// running (ADR-0031).
message Command {
  string command_id = 1;
  string kind = 2;            // "shell", "apply_updates", "configure_sources", ...
  bytes payload = 3;          // the serialized message of `kind`, like ApplyUpdates
  // ECDSA P-256 signature by the CA key over agent_id, command_id, kind,
  // payload, issued_at and expires_at, encoded as ADR-0031 says.
  bytes signature = 4;
  int64 issued_at_unix_ms = 5;
  // Agents refuse to start a command after this time.
  int64 expires_at_unix_ms = 6;
  // The agent the command is for; agents refuse another agent's command.
  string agent_id = 7;
}

// What an agent does when a command of one kind arrives (ADR-0076).
enum CommandAcceptance {
  // A value this server does not know: not reported, not a refusal.
  COMMAND_ACCEPTANCE_UNSPECIFIED = 0;
  COMMAND_ACCEPTANCE_ACCEPTED = 1;
  // Refused until the host's administrator allows it, like `commands.shell`.
  COMMAND_ACCEPTANCE_DISABLED = 2;
  // Refused whatever the configuration: this system cannot run the kind.
  COMMAND_ACCEPTANCE_UNSUPPORTED = 3;
}

message CommandKindState {
  // `Command.kind`, like "shell".
  string kind = 1;
  CommandAcceptance acceptance = 2;
}

enum CommandStatus {
  // Older agents: final, succeeded when exit_code is 0.
  COMMAND_STATUS_UNSPECIFIED = 0;
  // Interim: the agent started the command. A final status follows.
  COMMAND_STATUS_RUNNING = 1;
  COMMAND_STATUS_SUCCEEDED = 2;
  // The command ran and failed.
  COMMAND_STATUS_FAILED = 3;
  // Not run: it arrived after expires_at.
  COMMAND_STATUS_EXPIRED = 4;
  // Not run: bad signature, another agent's command, unknown kind or
  // invalid payload.
  COMMAND_STATUS_REJECTED = 5;
}

message CommandResult {
  string command_id = 1;
  int32 exit_code = 2;
  bytes stdout = 3;
  bytes stderr = 4;
  int64 started_at_unix_ms = 5;
  int64 finished_at_unix_ms = 6;
  CommandStatus status = 7;
  // Why the command failed or was not run, in one line; empty on success.
  string error = 8;
}

// Payload of "shell" commands (ADR-0043): one command line an AI provider
// proposed and the server's risk rules let through, run by the agent with
// `/bin/sh -c` as its own user. Agents refuse it unless `commands.shell`
// is enabled in their configuration.
message ShellCommand {
  string command = 1;
  // The agent kills the command and what it started after this many
  // seconds; 0 means the agent's default.
  uint32 timeout_seconds = 2;
}

// Payload of "ai_commands" commands (ADR-0098): turns the agent's AI
// commands, the "shell" kind, on or off. Agents always obey "off", and
// obey "on" only when their administrator allowed it with
// `commands.from_web`.
message AiCommandsSwitch {
  bool on = 1;
}

// Payload of "root_action" commands (ADR-0181): one action of a fixed
// catalog the AI may ask for, run as root by the agent's root helper
// (`sudo -n /usr/bin/monitorflow-agent root-action`), which checks the
// signed command, the host's consent (`commands.root_actions`) and the
// parameters before running anything. Never a command line.
message RootAction {
  oneof action {
    // Empty the package manager's download cache (apt-get clean,
    // dnf clean packages, zypper clean).
    CleanPackageCache clean_package_cache = 1;
    // Shrink the systemd journal to at most `max_megabytes`
    // (journalctl --vacuum-size).
    VacuumJournal vacuum_journal = 2;
    // Remove Docker images no container uses and the build cache.
    PruneDocker prune_docker = 3;
    // Restart one systemd service.
    RestartService restart_service = 4;
  }
}

message CleanPackageCache {}

message VacuumJournal {
  // Between 100 and 65536 (64 GiB).
  uint32 max_megabytes = 1;
}

message PruneDocker {}

message RestartService {
  // A unit name ending in `.service`, never a critical one (ADR-0181).
  string unit = 1;
}

// Payload of "run_script" commands (ADR-0189): a script of the central
// server's library, run by the agent as its own user. Agents refuse it
// unless `commands.scripts` is enabled in their configuration, which only
// the host's administrator sets.
message RunScript {
  // "sh" (`/bin/sh -c`, Linux) or "powershell" (Windows PowerShell 5.1).
  // An agent refuses an interpreter its system does not have.
  string interpreter = 1;
  // The script's text, exactly as the server classified it.
  string body = 2;
  // Parameters, given to the script as environment variables
  // `MF_PARAM_<NAME>` (the name in upper case), never written into its
  // text.
  repeated ScriptParameter parameters = 3;
  // The agent kills the script and what it started after this many
  // seconds; 0 means the agent's default.
  uint32 timeout_seconds = 4;
  // The library script and its version, for the agent's log.
  string script_id = 5;
  uint32 version = 6;
}

message ScriptParameter {
  // Lower case letters, digits and `_`, starting with a letter.
  string name = 1;
  string value = 2;
}

// Payload of "remote_session" commands (ADR-0190): opens a terminal on the
// agent, as the user its host allowed, when its administrator turned
// remote terminals on (`remote.terminal`). The server's key starts the
// session's end-to-end keys; the command's signature is what makes it the
// server's.
message RemoteSessionOpen {
  // UUID of the session, chosen by the server; every frame names it.
  string session_id = 1;
  // "terminal" with the command kind `remote_session`, or "desktop" with
  // `remote_desktop`: the host's own RDP service on 127.0.0.1:3389, and
  // nothing else (ADR-0190). Other kinds are refused.
  string kind = 2;
  // The server's X25519 public key for this session, 32 bytes.
  bytes server_key = 3;
  // Initial size of the terminal; 0 for a desktop.
  uint32 cols = 4;
  uint32 rows = 5;
  // Who opened it, as shown on the server's banner.
  string requested_by = 6;
  // The agent closes the session after this long without input.
  uint32 idle_timeout_seconds = 7;
  // Whether the central server records the session, as the banner says.
  bool recorded = 8;
}

// One frame of a remote session. Only `opened` and `closed` travel in the
// clear; everything else is `sealed`.
message RemoteFrame {
  string session_id = 1;
  oneof body {
    // Agent to server, once: the agent's half of the keys.
    RemoteOpened opened = 2;
    // Both ways: a RemoteData sealed with ChaCha20-Poly1305 under the key
    // of its direction, with `counter` as its nonce
    // (`common::remote`). A frame out of order ends the session.
    bytes sealed = 3;
    // Both ways: the session ended, or could not start. Unauthenticated,
    // as dropping frames is something any relay can do anyway.
    RemoteClosed closed = 4;
  }
  // Number of the sealed frame in its direction, from 0.
  uint64 counter = 5;
}

message RemoteOpened {
  // The agent's X25519 public key for this session, 32 bytes.
  bytes agent_key = 1;
  // The agent's certificate, DER: the server checks that its CA issued it
  // to this agent and that it is not revoked.
  bytes certificate = 2;
  // ECDSA P-256 signature with the certificate's key over the session ID
  // and both keys (`common::remote::opened_signed_bytes`), so a relay
  // cannot stand in for the agent.
  bytes signature = 3;
}

// What a sealed frame holds.
message RemoteData {
  oneof body {
    // Server to agent: keystrokes, or the bytes for the RDP service.
    bytes input = 1;
    // Agent to server: what the terminal printed, or the RDP service sent.
    bytes output = 2;
    // Server to agent: the browser's terminal changed size.
    RemoteResize resize = 3;
    // Either way: the session ends, with why.
    string close = 4;
    // Server to agent, desktops only: how many `output` frames the server
    // passed on to the browser so far. The agent keeps at most
    // `common::remote::DESKTOP_WINDOW` frames beyond it in flight, so a
    // slow browser slows the RDP service down instead of overflowing.
    uint64 delivered = 5;
  }
}

message RemoteResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message RemoteClosed {
  string reason = 1;
}

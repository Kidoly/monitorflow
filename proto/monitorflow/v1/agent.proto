// MonitorFlow agent protocol, version 1.
//
// Rules: changes are additive only. Never renumber or reuse a field number.
// Add new message kinds as new `oneof` variants of Envelope.

syntax = "proto3";

package monitorflow.v1;

import "monitorflow/v1/packages.proto";

// Long-lived bidirectional stream between an agent (or relay) and its upstream.
service AgentService {
  rpc Stream(stream Envelope) returns (stream Envelope);
}

// Every message on the stream is wrapped in an Envelope.
message Envelope {
  // Monotonic per sender, used for ordering and deduplication after reconnects.
  uint64 sequence = 1;

  oneof payload {
    Hello hello = 10;
    Heartbeat heartbeat = 11;
    SampleBatch samples = 12;
    SensorConfig sensor_config = 13;
    SensorConfigAck sensor_config_ack = 14;
    // Agent to server: installed packages and reboot state (ADR-0031).
    PackageReport package_report = 15;
    // Relay to server, on the relay's own stream: the mirrors it serves to
    // its agents (ADR-0037).
    RelayMirrors relay_mirrors = 16;
    // Agent to server: system log lines (ADR-0091).
    LogBatch logs = 17;
    Command command = 20;
    CommandResult command_result = 21;
  }
}

// First message sent by an agent on a new stream.
message Hello {
  string agent_id = 1;
  string protocol_version = 2;
  string agent_version = 3;
  string hostname = 4;
  // "debian", "rhel" or "windows": the package family, which decides the
  // mirror type. "linux" for any other distribution, which gets monitoring
  // only (ADR-0063).
  string os_family = 5;
  // Distribution and version, from /etc/os-release, like "debian 12".
  string os_version = 6;
  // No package manager the agent can drive on this host, even in a known
  // family: updates and sources are unavailable. Agents before ADR-0063
  // leave it false, and they all have one.
  bool no_package_manager = 7;
  // What the agent does with each kind of command, from the handlers it
  // runs (ADR-0076). Empty means not reported: agents before ADR-0076, or
  // a relay before it on the way, which drops this field. It says nothing
  // about whether the agent would accept a command.
  repeated CommandKindState command_kinds = 8;
  // The SMBIOS system UUID, lowercase, which Proxmox calls a VM's
  // `smbios1` uuid. Empty when unreadable, and inside containers, which
  // see their host's (ADR-0093).
  string system_uuid = 9;
  // MAC addresses of the network interfaces, lowercase `aa:bb:cc:dd:ee:ff`,
  // loopback and all-zero ones left out. Empty when not reported.
  repeated string mac_addresses = 10;
}

message Heartbeat {
  int64 sent_at_unix_ms = 1;
}

// A single sensor reading.
message Sample {
  string sensor = 1;
  string instance = 2;        // e.g. mount point, unit name, core index
  int64 timestamp_unix_ms = 3;
  double value = 4;
  map<string, string> labels = 5;
}

message SampleBatch {
  repeated Sample samples = 1;
}

// System log lines an agent forwards (ADR-0091), oldest first.
message LogBatch {
  repeated LogEntry entries = 1;
  // Lines the agent dropped since its previous batch because they came
  // faster than its rate limit allows.
  uint64 rate_limited = 2;
}

message LogEntry {
  int64 timestamp_unix_ms = 1;
  string message = 2;
  // syslog priority: 0 emergency to 7 debug.
  uint32 priority = 3;
  // The systemd unit, like "nginx.service"; empty when there is none.
  string unit = 4;
  // The syslog identifier, like "sshd" or "kernel".
  string identifier = 5;
  // The journal's boot ID, 32 hex digits.
  string boot_id = 6;
  uint32 pid = 7;
  // Where the line comes from: "journal".
  string source = 8;
}

// Sensors an agent must run, sent by the server after a valid Hello and
// again whenever the configuration changes (ADR-0016). Replaces the whole
// previous configuration.
message SensorConfig {
  // Grows with every change of the server's configuration in the database.
  uint64 revision = 1;
  repeated SensorSpec sensors = 2;
}

// One configured sensor; (name, instance) is unique within a SensorConfig.
message SensorSpec {
  // Implementation to run, like "cpu" or "port".
  string kind = 1;
  // Sensor name: the metric name on the server (ADR-0013).
  string name = 2;
  string instance = 3;
  uint64 interval_ms = 4;
  // 0 means the agent's default timeout, capped by the interval.
  uint64 timeout_ms = 5;
  // Kind-specific parameters.
  map<string, string> params = 6;
}

// Sent by an agent once it applied a SensorConfig, valid or not.
message SensorConfigAck {
  uint64 revision = 1;
  // Specs the agent refused; the others run.
  repeated SensorSpecError errors = 2;
}

message SensorSpecError {
  string name = 1;
  string instance = 2;
  string message = 3;
}

// What a relay's mirror listener serves, sent after its Hello and again
// whenever it changes (ADR-0037). Replaces the previous report.
message RelayMirrors {
  // Base URL the relay's agents reach its mirror listener at, from the
  // relay's `mirror.public_url`. Empty when the relay serves no mirrors.
  string public_url = 1;
  repeated ServedMirror mirrors = 2;
}

message ServedMirror {
  // "apt" or "dnf".
  string family = 1;
  string name = 2;
  // Snapshot `current` names; empty when there is none.
  string current = 3;
  // Complete snapshots the relay holds, `current` included.
  repeated string snapshots = 4;
}

// A command from the central server. Always signed; agents verify before
// running (ADR-0031).
message Command {
  string command_id = 1;
  string kind = 2;            // "shell", "apply_updates", "configure_sources", ...
  bytes payload = 3;          // the serialized message of `kind`, like ApplyUpdates
  // ECDSA P-256 signature by the CA key over agent_id, command_id, kind,
  // payload, issued_at and expires_at, encoded as ADR-0031 says.
  bytes signature = 4;
  int64 issued_at_unix_ms = 5;
  // Agents refuse to start a command after this time.
  int64 expires_at_unix_ms = 6;
  // The agent the command is for; agents refuse another agent's command.
  string agent_id = 7;
}

// What an agent does when a command of one kind arrives (ADR-0076).
enum CommandAcceptance {
  // A value this server does not know: not reported, not a refusal.
  COMMAND_ACCEPTANCE_UNSPECIFIED = 0;
  COMMAND_ACCEPTANCE_ACCEPTED = 1;
  // Refused until the host's administrator allows it, like `commands.shell`.
  COMMAND_ACCEPTANCE_DISABLED = 2;
  // Refused whatever the configuration: this system cannot run the kind.
  COMMAND_ACCEPTANCE_UNSUPPORTED = 3;
}

message CommandKindState {
  // `Command.kind`, like "shell".
  string kind = 1;
  CommandAcceptance acceptance = 2;
}

enum CommandStatus {
  // Older agents: final, succeeded when exit_code is 0.
  COMMAND_STATUS_UNSPECIFIED = 0;
  // Interim: the agent started the command. A final status follows.
  COMMAND_STATUS_RUNNING = 1;
  COMMAND_STATUS_SUCCEEDED = 2;
  // The command ran and failed.
  COMMAND_STATUS_FAILED = 3;
  // Not run: it arrived after expires_at.
  COMMAND_STATUS_EXPIRED = 4;
  // Not run: bad signature, another agent's command, unknown kind or
  // invalid payload.
  COMMAND_STATUS_REJECTED = 5;
}

message CommandResult {
  string command_id = 1;
  int32 exit_code = 2;
  bytes stdout = 3;
  bytes stderr = 4;
  int64 started_at_unix_ms = 5;
  int64 finished_at_unix_ms = 6;
  CommandStatus status = 7;
  // Why the command failed or was not run, in one line; empty on success.
  string error = 8;
}

// Payload of "shell" commands (ADR-0043): one command line an AI provider
// proposed and the server's risk rules let through, run by the agent with
// `/bin/sh -c` as its own user. Agents refuse it unless `commands.shell`
// is enabled in their configuration.
message ShellCommand {
  string command = 1;
  // The agent kills the command and what it started after this many
  // seconds; 0 means the agent's default.
  uint32 timeout_seconds = 2;
}

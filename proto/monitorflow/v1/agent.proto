// MonitorFlow agent protocol, version 1.
//
// Rules: changes are additive only. Never renumber or reuse a field number.
// Add new message kinds as new `oneof` variants of Envelope.

syntax = "proto3";

package monitorflow.v1;

import "monitorflow/v1/packages.proto";

// Long-lived bidirectional stream between an agent (or relay) and its upstream.
service AgentService {
  rpc Stream(stream Envelope) returns (stream Envelope);
}

// Every message on the stream is wrapped in an Envelope.
message Envelope {
  // Monotonic per sender, used for ordering and deduplication after reconnects.
  uint64 sequence = 1;

  oneof payload {
    Hello hello = 10;
    Heartbeat heartbeat = 11;
    SampleBatch samples = 12;
    SensorConfig sensor_config = 13;
    SensorConfigAck sensor_config_ack = 14;
    // Agent to server: installed packages and reboot state (ADR-0031).
    PackageReport package_report = 15;
    Command command = 20;
    CommandResult command_result = 21;
  }
}

// First message sent by an agent on a new stream.
message Hello {
  string agent_id = 1;
  string protocol_version = 2;
  string agent_version = 3;
  string hostname = 4;
  // "debian" or "rhel": the package family, which decides the mirror type.
  string os_family = 5;
  // Distribution and version, from /etc/os-release, like "debian 12".
  string os_version = 6;
}

message Heartbeat {
  int64 sent_at_unix_ms = 1;
}

// A single sensor reading.
message Sample {
  string sensor = 1;
  string instance = 2;        // e.g. mount point, unit name, core index
  int64 timestamp_unix_ms = 3;
  double value = 4;
  map<string, string> labels = 5;
}

message SampleBatch {
  repeated Sample samples = 1;
}

// Sensors an agent must run, sent by the server after a valid Hello and
// again whenever the configuration changes (ADR-0016). Replaces the whole
// previous configuration.
message SensorConfig {
  // Grows with every change of the server's configuration in the database.
  uint64 revision = 1;
  repeated SensorSpec sensors = 2;
}

// One configured sensor; (name, instance) is unique within a SensorConfig.
message SensorSpec {
  // Implementation to run, like "cpu" or "port".
  string kind = 1;
  // Sensor name: the metric name on the server (ADR-0013).
  string name = 2;
  string instance = 3;
  uint64 interval_ms = 4;
  // 0 means the agent's default timeout, capped by the interval.
  uint64 timeout_ms = 5;
  // Kind-specific parameters.
  map<string, string> params = 6;
}

// Sent by an agent once it applied a SensorConfig, valid or not.
message SensorConfigAck {
  uint64 revision = 1;
  // Specs the agent refused; the others run.
  repeated SensorSpecError errors = 2;
}

message SensorSpecError {
  string name = 1;
  string instance = 2;
  string message = 3;
}

// A command from the central server. Always signed; agents verify before
// running (ADR-0031).
message Command {
  string command_id = 1;
  string kind = 2;            // "shell", "apply_updates", "configure_sources", ...
  bytes payload = 3;          // the serialized message of `kind`, like ApplyUpdates
  // ECDSA P-256 signature by the CA key over agent_id, command_id, kind,
  // payload, issued_at and expires_at, encoded as ADR-0031 says.
  bytes signature = 4;
  int64 issued_at_unix_ms = 5;
  // Agents refuse to start a command after this time.
  int64 expires_at_unix_ms = 6;
  // The agent the command is for; agents refuse another agent's command.
  string agent_id = 7;
}

enum CommandStatus {
  // Older agents: final, succeeded when exit_code is 0.
  COMMAND_STATUS_UNSPECIFIED = 0;
  // Interim: the agent started the command. A final status follows.
  COMMAND_STATUS_RUNNING = 1;
  COMMAND_STATUS_SUCCEEDED = 2;
  // The command ran and failed.
  COMMAND_STATUS_FAILED = 3;
  // Not run: it arrived after expires_at.
  COMMAND_STATUS_EXPIRED = 4;
  // Not run: bad signature, another agent's command, unknown kind or
  // invalid payload.
  COMMAND_STATUS_REJECTED = 5;
}

message CommandResult {
  string command_id = 1;
  int32 exit_code = 2;
  bytes stdout = 3;
  bytes stderr = 4;
  int64 started_at_unix_ms = 5;
  int64 finished_at_unix_ms = 6;
  CommandStatus status = 7;
  // Why the command failed or was not run, in one line; empty on success.
  string error = 8;
}

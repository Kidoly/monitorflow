// MonitorFlow enrollment protocol, version 1. See ADR-0007.
//
// Rules: changes are additive only. Never renumber or reuse a field number.

syntax = "proto3";

package monitorflow.v1;

// Exchanges a one-time token for a client certificate. Served on its own
// listener with server-only TLS, since callers have no certificate yet.
service EnrollService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

message EnrollRequest {
  // One-time token `mfe1.<secret>.<ca>` created by an administrator.
  string token = 1;
  // PKCS#10 certificate signing request in PEM. Only its public key is
  // used: the identity comes from the token.
  string csr_pem = 2;
  // Host name of an enrolling agent. With a reusable install key it
  // becomes the agent's ID, made unique by the server (ADR-0058); a
  // single-use token ignores it. Relays send it too: a relay's install key
  // takes the relay's ID from it (ADR-0066).
  string hostname = 3;
  // DNS names and IP addresses a relay finds on its host. Only proposals:
  // none reaches a certificate until an administrator confirms it, and a
  // token that names server names ignores them (ADR-0066).
  repeated string server_names = 4;
}

message EnrollResponse {
  // Client certificate in PEM.
  string cert_pem = 1;
  // CA certificate in PEM. Its SHA-256 must equal the token's CA pin.
  string ca_cert_pem = 2;
  // Identity written in the certificate, `monitorflow://<role>/<id>`.
  string peer_uri = 3;
  // End of the certificate's validity, Unix seconds.
  int64 not_after_unix = 4;
}

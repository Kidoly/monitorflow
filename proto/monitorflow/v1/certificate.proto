// MonitorFlow certificate protocol, version 1. See ADR-0010.
//
// Rules: changes are additive only. Never renumber or reuse a field number.

syntax = "proto3";

package monitorflow.v1;

// Certificate lifecycle for enrolled peers. Served on the mTLS gRPC
// listener: the client certificate of the connection authenticates every
// call.
service CertificateService {
  // Issues a new certificate for the identity of the presenting
  // certificate, before it expires.
  rpc Renew(RenewRequest) returns (RenewResponse);
  // A relay forwards the `Renew` of a peer it terminated the mTLS of, with
  // that peer's certificate. Only relay certificates may call it; the
  // upstream checks the relay may speak for the peer (ADR-0028).
  rpc RenewForwarded(ForwardedRenewRequest) returns (RenewResponse);
}

message RenewRequest {
  // PKCS#10 certificate signing request in PEM, for a fresh key. Only its
  // public key is used: the identity comes from the presenting certificate.
  string csr_pem = 1;
}

message ForwardedRenewRequest {
  // The peer's CSR, unchanged.
  string csr_pem = 1;
  // DER leaf certificate the peer presented to the relay, which verified
  // it against the CA and the CRL. The identity of the new certificate is
  // the one of this certificate.
  bytes peer_cert_der = 2;
}

message RenewResponse {
  // Client certificate in PEM.
  string cert_pem = 1;
  // CA certificate in PEM. Peers check it is the CA they already trust.
  string ca_cert_pem = 2;
  // Identity written in the certificate, `monitorflow://<role>/<id>`.
  string peer_uri = 3;
  // End of the certificate's validity, Unix seconds.
  int64 not_after_unix = 4;
}

// The CA's certificate revocation list, for relays: a relay terminates the
// mTLS of its agents and must refuse revoked certificates like the server
// does (ADR-0025). Served on the mTLS gRPC listener to relays only.
service RevocationService {
  rpc GetCrl(GetCrlRequest) returns (GetCrlResponse);
}

message GetCrlRequest {}

message GetCrlResponse {
  // The current CRL in DER, signed by the CA. The same list the server's
  // listener enforces, including its next_update.
  bytes crl_der = 1;
}

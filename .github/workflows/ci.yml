name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: monitorflow
          POSTGRES_PASSWORD: monitorflow
          POSTGRES_DB: monitorflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monitorflow -d monitorflow"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-numbers.sh
      # Installs the toolchain and components named in rust-toolchain.toml,
      # the single source of truth for the Rust version.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # DATABASE_URL enables the PostgreSQL tests (crates/server/build.rs).
      - run: cargo test --workspace
        env:
          DATABASE_URL: postgres://monitorflow:monitorflow@localhost:5432/monitorflow
  # A small load test (ADR-0090, docs/load-test.md): 100 simulated agents,
  # a command to each and a server restart, against the debug server and
  # relay. It fails when an agent does not connect or come back, or a
  # command does not finish.
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: scripts/load-test.sh --agents 100 --steady 30 --phases commands,restart --strict
        env:
          LOADTEST_PROFILE: debug
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-test
          path: |
            target/loadtest/report.md
            target/loadtest/*.log
            target/load-test-postgres.log
          if-no-files-found: ignore
  # The Windows agent (ADR-0047): the agent and the crates it builds on,
  # then its MSI package (ADR-0050). The server and relay are Unix only;
  # tests that need them or PostgreSQL are compiled out on Windows.
  windows:
    runs-on: windows-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: choco install protoc --no-progress -y
      - run: cargo clippy -p monitorflow-agent -p monitorflow-sensors -p monitorflow-common --all-targets -- -D warnings
      - run: cargo test --no-fail-fast -p monitorflow-agent -p monitorflow-sensors -p monitorflow-common
      - run: cargo build --release -p monitorflow-agent
      # The MSI package (ADR-0050), and a second one with a higher version
      # to test upgrades; the smoke test installs, upgrades and removes
      # them on this runner.
      - name: Build the MSI
        shell: pwsh
        run: |
          deploy/windows/build-msi.ps1
          deploy/windows/build-msi.ps1 -OutDir target\msi-upgrade -Version 255.0.0
      - name: Smoke-test the MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem target\msi\*.msi).FullName
          deploy/windows/smoke-test.ps1 -Msi $msi -UpgradeMsi target\msi-upgrade\monitorflow-agent-255.0.0-x64.msi
      - name: Upload the MSI logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-smoke-test-logs
          path: |
            ${{ runner.temp }}/monitorflow-msi
            C:/ProgramData/MonitorFlow/agent/logs
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monitorflow-agent-windows-x86_64
          path: target/release/monitorflow-agent.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monitorflow-agent-windows-x86_64-msi
          path: target/msi/*.msi
          if-no-files-found: error
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  # The production compose (ADR-0051): builds both images, starts the stack
  # and checks it, the TLS database link included.
  # Then the agent installer (ADR-0052) against the same stack: the static
  # agent and relay served from a local HTTPS directory, installed,
  # enrolled, upgraded and removed on this runner.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: deploy/smoke-test.sh
      # Both agents trust a throwaway release key, so the test can sign
      # releases they accept (ADR-0053).
      - name: Throwaway release key
        run: |
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/e2e-signing.pem"
          { cat deploy/release-keys.pem; openssl pkey -in "$RUNNER_TEMP/e2e-signing.pem" -pubout; } >"$RUNNER_TEMP/e2e-release-keys.pem"
          echo "MONITORFLOW_RELEASE_KEYS=$RUNNER_TEMP/e2e-release-keys.pem" >>"$GITHUB_ENV"
      - id: agent
        uses: ./.github/actions/build-agent-linux
        with:
          target: x86_64-unknown-linux-musl
      - run: cp "${{ steps.agent.outputs.path }}" "$RUNNER_TEMP/agent-old"
      # A newer version to self-update to.
      - id: newer
        uses: ./.github/actions/build-agent-linux
        env:
          MONITORFLOW_BUILD_VERSION: 99.0.0
        with:
          target: x86_64-unknown-linux-musl
      # Kept aside: the relay builds below link the agent library.
      - run: cp "${{ steps.newer.outputs.path }}" "$RUNNER_TEMP/agent-new"
      # The relay, installed with MF_ROLE=relay (ADR-0055).
      - id: relay
        uses: ./.github/actions/build-agent-linux
        with:
          target: x86_64-unknown-linux-musl
          package: monitorflow-relay
      - run: cp "${{ steps.relay.outputs.path }}" "$RUNNER_TEMP/relay-old"
      - id: newer-relay
        uses: ./.github/actions/build-agent-linux
        env:
          MONITORFLOW_BUILD_VERSION: 99.0.0
        with:
          target: x86_64-unknown-linux-musl
          package: monitorflow-relay
      - run: |
          ls -l target/x86_64-unknown-linux-musl/release/
          cp "${{ steps.newer-relay.outputs.path }}" "$RUNNER_TEMP/relay-new"
      - run: deploy/install-test.sh "$RUNNER_TEMP/agent-old" "$RUNNER_TEMP/agent-new"
        env:
          MF_TEST_SIGNING_KEY: ${{ runner.temp }}/e2e-signing.pem
          MF_TEST_RELAY: ${{ runner.temp }}/relay-old
          MF_TEST_NEWER_RELAY: ${{ runner.temp }}/relay-new
  # Server updates (ADR-0056): a compose stack updated through the API from
  # a base build to a newer signed release pushed to a local registry,
  # keeping its data and taking a backup, then a release whose server
  # cannot start rolled back. The images trust a throwaway release key.
  # Then the server installer (ADR-0065) with the same images, as no
  # release has any yet: on a systemd container without Docker, from a
  # local registry and signed release files.
  server-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Throwaway release key
        run: |
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/e2e-signing.pem"
          openssl pkey -in "$RUNNER_TEMP/e2e-signing.pem" -pubout >>deploy/release-keys.pem
      - run: deploy/update-test.sh
        env:
          MF_TEST_SIGNING_KEY: ${{ runner.temp }}/e2e-signing.pem
      - run: deploy/install-server-test.sh
        timeout-minutes: 25
        env:
          MF_TEST_SIGNING_KEY: ${{ runner.temp }}/e2e-signing.pem
  # The installer is piped to sh, so it must stay POSIX (ADR-0052).
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck --version && shellcheck deploy/*.sh deploy/docker/*.sh deploy/mirror-fixture/*.sh scripts/*.sh

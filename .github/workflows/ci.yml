name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: monitorflow
          POSTGRES_PASSWORD: monitorflow
          POSTGRES_DB: monitorflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monitorflow -d monitorflow"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain and components named in rust-toolchain.toml,
      # the single source of truth for the Rust version.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # DATABASE_URL enables the PostgreSQL tests (crates/server/build.rs).
      - run: cargo test --workspace
        env:
          DATABASE_URL: postgres://monitorflow:monitorflow@localhost:5432/monitorflow
  # The Windows agent (ADR-0047): the agent and the crates it builds on.
  # The server and relay are Unix only; tests that need them or
  # PostgreSQL are compiled out on Windows.
  windows:
    runs-on: windows-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: choco install protoc --no-progress -y
      - run: cargo clippy -p monitorflow-agent -p monitorflow-sensors -p monitorflow-common --all-targets -- -D warnings
      - run: cargo test --no-fail-fast -p monitorflow-agent -p monitorflow-sensors -p monitorflow-common
      - run: cargo build --release -p monitorflow-agent
      - uses: actions/upload-artifact@v4
        with:
          name: monitorflow-agent-windows-x86_64
          path: target/release/monitorflow-agent.exe
          if-no-files-found: error
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

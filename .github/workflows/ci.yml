name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: monitorflow
          POSTGRES_PASSWORD: monitorflow
          POSTGRES_DB: monitorflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monitorflow -d monitorflow"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # DATABASE_URL enables the PostgreSQL tests (crates/server/build.rs).
      - run: cargo test --workspace
        env:
          DATABASE_URL: postgres://monitorflow:monitorflow@localhost:5432/monitorflow

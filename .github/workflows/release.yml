# Agent release files (ADR-0052): static Linux binaries of the agent and
# the relay (ADR-0055) for x86_64 and aarch64, the Windows executable and
# MSI, the installer, the systemd units and sudo rules, VERSION, SHA256SUMS and its signature SHA256SUMS.sig
# (ADR-0053). A `v*` tag publishes them as a GitHub Release with stable
# asset names, so releases/latest/download/<name> works; it signs with the
# RELEASE_SIGNING_KEY secret, whose public half must be in
# deploy/release-keys.pem (docs/releasing.md). A manual run, or a pull
# request that changes these files, builds the same files as the
# `release-files` artifact, signed with a throwaway key, and publishes
# nothing.
# It also builds the server, web and updater images for amd64 and arm64
# (ADR-0056); a tag pushes them to GHCR and lists their digests in
# images.json, a release file covered by the signature. Other runs build
# them without pushing.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/build-agent-linux/**
      - deploy/install.sh
      - deploy/release-files.sh
      - deploy/release-keys.pem
      - deploy/systemd/**
      - deploy/sudoers/**
      - deploy/docker/**
      - deploy/caddy/**
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      registry: ${{ steps.version.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      # A tag must name the version in Cargo.toml: v0.2.0 for 0.2.0.
      - id: version
        run: |
          cargo=$(awk -F '"' '/^\[workspace.package\]/ { in_ws = 1 } in_ws && /^version = / { print $2; exit }' Cargo.toml)
          [ -n "$cargo" ] || { echo "::error::no version in Cargo.toml"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag=${GITHUB_REF_NAME#v}
            if [ "$tag" != "$cargo" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match version $cargo in Cargo.toml"
              exit 1
            fi
            echo publish=true >>"$GITHUB_OUTPUT"
          else
            echo publish=false >>"$GITHUB_OUTPUT"
          fi
          echo "version=$cargo" >>"$GITHUB_OUTPUT"
          # Image names must be lower case.
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >>"$GITHUB_OUTPUT"
          echo "version $cargo"
  linux:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: ./.github/actions/build-agent-linux
        with:
          target: ${{ matrix.arch }}-unknown-linux-musl
      # Now: the next build's cache restore may clean target/.
      - run: |
          mkdir dist
          cp "${{ steps.build.outputs.path }}" "dist/monitorflow-agent-linux-${{ matrix.arch }}"
      - id: relay
        uses: ./.github/actions/build-agent-linux
        with:
          target: ${{ matrix.arch }}-unknown-linux-musl
          package: monitorflow-relay
      # Static, for the right machine; the x86_64 ones also run here.
      - run: |
          cp "${{ steps.relay.outputs.path }}" "dist/monitorflow-relay-linux-${{ matrix.arch }}"
          for built in dist/*; do
            file "$built" | tee /dev/stderr | grep -q 'statically linked'
          done
      - if: matrix.arch == 'x86_64'
        run: |
          test "$(dist/monitorflow-agent-linux-x86_64 --version)" = "monitorflow-agent ${{ needs.version.outputs.version }}"
          test "$(dist/monitorflow-relay-linux-x86_64 --version)" = "monitorflow-relay ${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
  windows:
    needs: version
    runs-on: windows-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: choco install protoc --no-progress -y
      - run: cargo build --release --locked -p monitorflow-agent
      - name: Build the MSI
        shell: pwsh
        run: |
          deploy/windows/build-msi.ps1
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\monitorflow-agent.exe dist\monitorflow-agent-windows-x86_64.exe
          Copy-Item (Get-ChildItem target\msi\*.msi).FullName dist\monitorflow-agent-windows-x86_64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/
          if-no-files-found: error
  # One image for one platform per job, on a native runner: building Rust
  # under emulation would take hours. Pushed by digest only; the manifests
  # job joins the platforms.
  images:
    needs: version
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [server, web, updater]
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: needs.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=monitorflow-${{ matrix.image }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ needs.version.outputs.registry }}/monitorflow-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ needs.version.outputs.publish }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}
      - run: |
          mkdir digests
          echo "${{ steps.build.outputs.digest }}" >"digests/${{ matrix.image }}-${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform }}
          path: digests/
          if-no-files-found: error
  # The multi-platform index of each image, tagged with the version, and
  # images.json naming the indexes by digest. Without publishing there is
  # no index: images.json names the amd64 images, so its format is still
  # tested.
  manifests:
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - if: needs.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - env:
          PUBLISH: ${{ needs.version.outputs.publish }}
          REGISTRY: ${{ needs.version.outputs.registry }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          images='{}'
          for image in server web updater; do
            repo=$REGISTRY/monitorflow-$image
            amd64=$(cat "digests/$image-amd64") arm64=$(cat "digests/$image-arm64")
            if [ "$PUBLISH" = true ]; then
              docker buildx imagetools create -t "$repo:$VERSION" "$repo@$amd64" "$repo@$arm64"
              digest=$(docker buildx imagetools inspect "$repo:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
            else
              digest=$amd64
            fi
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest for $image: $digest"; exit 1; }
            images=$(jq --arg k "$image" --arg v "$repo@$digest" '. + {($k): $v}' <<<"$images")
          done
          mkdir dist
          jq -n --arg version "$VERSION" --argjson images "$images" \
            '{version: $version, images: $images}' >dist/images.json
          cat dist/images.json
      - uses: actions/upload-artifact@v4
        with:
          name: images-json
          path: dist/
          if-no-files-found: error
  release:
    needs: [version, linux, windows, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The release files only, not the image digests.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: linux-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: windows-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: images-json
      # Only the publishing run sees the secret. Other runs sign with a
      # throwaway key, added to the keys the installer gets, so the files
      # are complete but trusted by no released agent.
      - name: Sign the release files
        env:
          PUBLISH: ${{ needs.version.outputs.publish }}
          RELEASE_SIGNING_KEY: ${{ needs.version.outputs.publish == 'true' && secrets.RELEASE_SIGNING_KEY || '' }}
          MF_RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          umask 077
          key=$RUNNER_TEMP/release-signing.pem
          if [ "$PUBLISH" = true ]; then
            if [ -z "$RELEASE_SIGNING_KEY" ]; then
              echo "::error::the RELEASE_SIGNING_KEY secret is not set; see docs/releasing.md"
              exit 1
            fi
            printf '%s\n' "$RELEASE_SIGNING_KEY" >"$key"
          else
            openssl genpkey -algorithm ed25519 -out "$key"
            { cat deploy/release-keys.pem; openssl pkey -in "$key" -pubout; } >"$RUNNER_TEMP/release-keys.pem"
            export MF_RELEASE_KEYS=$RUNNER_TEMP/release-keys.pem
          fi
          MF_SIGNING_KEY=$key deploy/release-files.sh dist
          rm -f "$key"
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
      # A version with a suffix (0.2.0-rc.1) is a pre-release, which
      # releases/latest never points to.
      - if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          flags=()
          case $VERSION in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes \
            --title "MonitorFlow $VERSION" "${flags[@]}"

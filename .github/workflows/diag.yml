name: diag (temporary, removed before merge)
on:
  pull_request:
permissions:
  contents: read
jobs:
  windows-diag:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - name: Time Windows PowerShell as the script sensor starts it
        shell: pwsh
        run: |
          $ps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $dir = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'diag')
          Set-Content "$dir\exit.ps1" "exit 1"
          Set-Content "$dir\write.ps1" "Write-Output 'WARNING'`nexit 1"
          Set-Content "$dir\autoload.ps1" "Write-Output `"env=`$((Get-ChildItem env: | Measure-Object).Count)`"`nexit 1"
          Set-Content "$dir\module.ps1" "Write-Output (Get-Module | ForEach-Object Name) -join ','`nWrite-Output `$env:PSModulePath`nexit 1"
          $keep = 'SystemRoot','SystemDrive','windir','ComSpec','PATHEXT','ProgramData','ProgramFiles','ProgramFiles(x86)','ProgramW6432','CommonProgramFiles','CommonProgramFiles(x86)','CommonProgramW6432','COMPUTERNAME','NUMBER_OF_PROCESSORS','PROCESSOR_ARCHITECTURE','USERPROFILE','APPDATA','LOCALAPPDATA','TEMP','TMP'
          function Run($script, [switch]$Clear) {
            $psi = [System.Diagnostics.ProcessStartInfo]::new($ps)
            foreach ($a in '-NoLogo','-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',"$dir\$script") { $psi.ArgumentList.Add($a) }
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            if ($Clear) {
              $psi.Environment.Clear()
              foreach ($k in $keep) { $v = [Environment]::GetEnvironmentVariable($k); if ($v) { $psi.Environment[$k] = $v } }
              $psi.Environment['PATH'] = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
            }
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = [Diagnostics.Process]::Start($psi)
            $out = $p.StandardOutput.ReadToEnd()
            $p.WaitForExit()
            "{0,-14} clear={1,-5} {2,6:N1}s exit={3} out={4}" -f $script, [bool]$Clear, $sw.Elapsed.TotalSeconds, $p.ExitCode, ($out -replace "`r?`n", ' | ').Substring(0, [Math]::Min(200, $out.Length))
          }
          "modules in Program Files: " + (Get-ChildItem "$env:ProgramFiles\WindowsPowerShell\Modules" -Directory).Count
          "runner PSModulePath: $env:PSModulePath"
          "analysis cache: " + (Get-ChildItem "$env:LOCALAPPDATA\Microsoft\Windows\PowerShell" -ErrorAction SilentlyContinue | Out-String)
          foreach ($round in 1..3) {
            Run exit.ps1 -Clear
            Run write.ps1 -Clear
            Run autoload.ps1 -Clear
            Run autoload.ps1
          }
          Run module.ps1 -Clear
          Run module.ps1
          "analysis cache after: " + (Get-ChildItem "$env:LOCALAPPDATA\Microsoft\Windows\PowerShell" -ErrorAction SilentlyContinue | Out-String)
      - name: Register new event sources with eventcreate
        shell: pwsh
        run: |
          $denied = 0
          foreach ($i in 1..40) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $out = eventcreate /L APPLICATION /T ERROR /SO "MonitorFlowDiag$i" /ID 901 /D "diag $i" 2>&1
            $code = $LASTEXITCODE
            if ($code -ne 0) { $denied++ }
            "{0,2} new source exit={1} {2,5:N2}s {3}" -f $i, $code, $sw.Elapsed.TotalSeconds, ($out -join ' ')
            $out = eventcreate /L APPLICATION /T ERROR /SO "MonitorFlowDiag$i" /ID 901 /D "again $i" 2>&1
            if ($LASTEXITCODE -ne 0) { "   existing source failed: $($out -join ' ')" }
          }
          "failed new-source registrations: $denied of 40"
          $jobs = 1..10 | ForEach-Object { Start-Job -ArgumentList $_ { param($i) $o = eventcreate /L APPLICATION /T ERROR /SO "MonitorFlowPar$i" /ID 901 /D "par" 2>&1; "$i exit=$LASTEXITCODE $o" } }
          $jobs | Wait-Job | Receive-Job

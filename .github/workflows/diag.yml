name: diag (temporary, removed before merge)
on:
  pull_request:
permissions:
  contents: read
jobs:
  windows-diag:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1]
    steps:
      - name: Find the variable that makes Windows PowerShell slow
        shell: pwsh
        run: |
          $ps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $dir = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'diag')
          Set-Content "$dir\write.ps1" "Write-Output 'WARNING'`nWrite-Output `"cache=`$env:PSModuleAnalysisCachePath`"`nexit 1"
          $keep = 'SystemRoot','SystemDrive','windir','ComSpec','PATHEXT','ProgramData','ProgramFiles','ProgramFiles(x86)','ProgramW6432','CommonProgramFiles','CommonProgramFiles(x86)','CommonProgramW6432','COMPUTERNAME','NUMBER_OF_PROCESSORS','PROCESSOR_ARCHITECTURE','USERPROFILE','APPDATA','LOCALAPPDATA','TEMP','TMP'
          function Run($label, [hashtable]$Env) {
            $psi = [System.Diagnostics.ProcessStartInfo]::new($ps)
            foreach ($a in '-NoLogo','-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',"$dir\write.ps1") { $psi.ArgumentList.Add($a) }
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.Environment.Clear()
            foreach ($k in $Env.Keys) { $psi.Environment[$k] = $Env[$k] }
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = [Diagnostics.Process]::Start($psi)
            $out = $p.StandardOutput.ReadToEnd()
            $p.WaitForExit()
            "{0,-40} {1,6:N1}s {2}" -f $label, $sw.Elapsed.TotalSeconds, ($out -replace "`r?`n", ' | ')
          }
          $all = @{}
          Get-ChildItem env: | ForEach-Object { $all[$_.Name] = $_.Value }
          $base = @{}
          foreach ($k in $keep) { if ($all[$k]) { $base[$k] = $all[$k] } }
          $base['PATH'] = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          "runner variables missing from the sensor's: " + (($all.Keys | Where-Object { -not $base.ContainsKey($_) } | Sort-Object) -join ', ')
          "PSModuleAnalysisCachePath=$env:PSModuleAnalysisCachePath"
          Run 'sensor environment' $base
          Run 'full runner environment' $all
          foreach ($k in 'PSModuleAnalysisCachePath','PSModulePath','USERNAME','USERDOMAIN','HOMEDRIVE','HOMEPATH','ALLUSERSPROFILE','PUBLIC','OS','PROCESSOR_IDENTIFIER','PROCESSOR_LEVEL','PROCESSOR_REVISION') {
            if ($all.ContainsKey($k)) {
              $plus = $base.Clone(); $plus[$k] = $all[$k]
              Run "sensor + $k" $plus
              $minus = $all.Clone(); $minus.Remove($k)
              Run "full - $k" $minus
            }
          }
      - name: Register new event sources with eventcreate
        shell: pwsh
        run: |
          $denied = 0
          foreach ($i in 1..40) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $out = eventcreate /L APPLICATION /T ERROR /SO "MonitorFlowDiag$i" /ID 901 /D "diag $i" 2>&1
            $code = $LASTEXITCODE
            if ($code -ne 0) { $denied++ }
            "{0,2} new source exit={1} {2,5:N2}s {3}" -f $i, $code, $sw.Elapsed.TotalSeconds, ($out -join ' ')
            $out = eventcreate /L APPLICATION /T ERROR /SO "MonitorFlowDiag$i" /ID 901 /D "again $i" 2>&1
            if ($LASTEXITCODE -ne 0) { "   existing source failed: $($out -join ' ')" }
          }
          "failed new-source registrations: $denied of 40"
          $jobs = 1..10 | ForEach-Object { Start-Job -ArgumentList $_ { param($i) $o = eventcreate /L APPLICATION /T ERROR /SO "MonitorFlowPar$i" /ID 901 /D "par" 2>&1; "$i exit=$LASTEXITCODE $o" } }
          $jobs | Wait-Job | Receive-Job

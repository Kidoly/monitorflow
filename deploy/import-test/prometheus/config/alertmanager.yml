# Alertmanager of the import test stack. Every address is an example: the
# containers resolve them to nothing (compose.yml), so no notification
# leaves this machine.
global:
  resolve_timeout: 5m
  smtp_smarthost: mail.example.com:587
  smtp_from: alertmanager@example.com
  smtp_auth_username: alertmanager@example.com
  smtp_auth_password: example-smtp-password
  smtp_require_tls: true

route:
  receiver: ops-email
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity=~"critical|page"']
      receiver: on-call
      continue: true
    - matchers: ['alertname=~"Blackbox.*"']
      receiver: web-team
    # Muted while known work runs (ADR-0151): backups of the databases
    # on Sunday nights, and the CPU alert of the web server during its
    # nightly batch, in Paris time.
    - matchers: ['instance=~"db-.*"']
      receiver: ops-email
      mute_time_intervals: [sunday-backups]
    - matchers: ['instance=~"web-01.*"', 'alertname="HostHighCpuLoad"']
      receiver: ops-email
      mute_time_intervals: [nightly-batch]

time_intervals:
  - name: sunday-backups
    time_intervals:
      - weekdays: [sunday]
        times: [{start_time: '01:00', end_time: '05:00'}]
  - name: nightly-batch
    time_intervals:
      - weekdays: ['monday:friday']
        times: [{start_time: '22:00', end_time: '24:00'}]
        location: Europe/Paris

receivers:
  - name: ops-email
    email_configs:
      - to: ops@example.com, admin@example.com
        send_resolved: true

  - name: on-call
    slack_configs:
      - api_url: https://hooks.slack.com/services/T0/B0/EXAMPLE
        channel: "#alerts"
        send_resolved: true
    pagerduty_configs:
      - routing_key: 0123456789abcdef0123456789abcdef

  - name: web-team
    msteams_configs:
      - webhook_url: https://example00.westeurope.logic.azure.com/workflows/00000000000000000000000000000000/triggers/manual/paths/invoke?api-version=2016-06-01&sig=EXAMPLE
    discord_configs:
      - webhook_url: https://discord.com/api/webhooks/000000000000000000/EXAMPLE-TOKEN

  - name: automation
    webhook_configs:
      - url: http://hooks.example.com/alertmanager
        send_resolved: true

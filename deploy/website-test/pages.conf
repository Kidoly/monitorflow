# The pages of every site of nginx.conf.
root /pages;
location = / { try_files /index.html =404; }
location = /error { try_files /error.html =404; }
location = /unavailable { return 503 "down for maintenance\n"; }
location = /moved { return 302 /; }
location = /loop { return 302 /loop; }
# About 40 KiB sent at 2 KiB a second: far longer than the check's timeout.
location = /slow {
    limit_rate_after 0;
    limit_rate 2k;
    try_files /big.html =404;
}
location = /private {
    auth_basic "website test";
    auth_basic_user_file /pages/htpasswd;
    try_files /index.html =404;
}
# Answers once the test writes toggle.html, 503 until then.
location = /toggle { try_files /toggle.html =503; }

# The sites the website test checks (ADR-0150): pages with chosen status
# codes, text, redirects, a slow page and one behind a password, over
# HTTP and over HTTPS with each kind of certificate.
events {}
http {
    default_type text/html;
    access_log off;


    server {
        listen 80;
        include /etc/nginx/pages.conf;
    }
    server {
        listen 8443 ssl;
        ssl_certificate /certs/valid.pem;
        ssl_certificate_key /certs/valid-key.pem;
        include /etc/nginx/pages.conf;
    }
    server {
        listen 8444 ssl;
        ssl_certificate /certs/expired.pem;
        ssl_certificate_key /certs/expired-key.pem;
        include /etc/nginx/pages.conf;
    }
    server {
        listen 8445 ssl;
        ssl_certificate /certs/wrong.pem;
        ssl_certificate_key /certs/wrong-key.pem;
        include /etc/nginx/pages.conf;
    }
    server {
        listen 8446 ssl;
        ssl_certificate /certs/soon.pem;
        ssl_certificate_key /certs/soon-key.pem;
        include /etc/nginx/pages.conf;
    }
    server {
        listen 8447 ssl;
        ssl_certificate /certs/self.pem;
        ssl_certificate_key /certs/self-key.pem;
        include /etc/nginx/pages.conf;
    }
}

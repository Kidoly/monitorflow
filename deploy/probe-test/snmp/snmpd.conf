# net-snmp for the SNMP test (ADR-0149): v2c and v3 with authentication
# and privacy, read-only, everything visible. Test credentials only.
agentAddress udp:161
rocommunity e2e-community default
createUser e2e-sha256 SHA-256 "e2e-auth-password" AES "e2e-priv-password"
createUser e2e-sha512 SHA-512 "e2e-auth-password" AES-256 "e2e-priv-password"
rouser e2e-sha256 priv
rouser e2e-sha512 priv
sysName nas-e2e
sysLocation test
sysContact test

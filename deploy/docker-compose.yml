# MonitorFlow central server for production (ADR-0051, docs/deploy-server.md).
# Copy .env.example to .env next to this file and fill it in, then:
#   docker compose -f deploy/docker-compose.yml up -d --build
# SERVER_IMAGE, WEB_IMAGE, UPDATER_IMAGE and MIRROR_IMAGE in .env run the
# images of a release by digest instead of local builds; the updater sets
# them when it installs a release (ADR-0056).
name: monitorflow

x-server-build: &server-build
  context: ..
  dockerfile: deploy/docker/server.Dockerfile

x-web-build: &web-build
  context: ..
  dockerfile: deploy/docker/web.Dockerfile

# Every service (ADR-0110): no process gains privileges through setuid
# binaries, and no Linux capability unless the service adds it back with a
# comment saying why.
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

# The links to the metric and log stores: TLS with a certificate of the
# server's CA, and a password (ADR-0087).
x-storage-tls: &storage-tls
  MONITORFLOW_VICTORIAMETRICS_URL: https://victoriametrics:8428
  MONITORFLOW_VICTORIALOGS_URL: https://victorialogs:9428
  MONITORFLOW_STORAGE_TLS_DIR: /var/lib/monitorflow/storage-tls

services:
  # One-shot: the CA and certificate of the PostgreSQL link, on first start.
  db-certs:
    build: *server-build
    image: ${SERVER_IMAGE:-monitorflow-server:local}
    entrypoint: ["db-certs"]
    user: "0"
    <<: *hardening
    # Hands the key to PostgreSQL's user.
    cap_add: [CHOWN]
    read_only: true
    network_mode: none
    volumes: ["dbcerts:/certs"]

  # One-shot: the certificate and password of the metric and log stores,
  # issued by the server's CA before they start (ADR-0087). The server
  # renews the certificate while it runs.
  storage-certs:
    build: *server-build
    image: ${SERVER_IMAGE:-monitorflow-server:local}
    command: ["storage-certs"]
    environment: *storage-tls
    <<: *hardening
    read_only: true
    network_mode: none
    volumes:
      - serverdata:/var/lib/monitorflow/server
      - storagetls:/var/lib/monitorflow/storage-tls

  postgres:
    # By digest (ADR-0110): the release signature covers this file, so it
    # covers the image too. Dependabot updates both parts together.
    image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    <<: *hardening
    # The entrypoint starts as root, gives the data and socket directories
    # to the postgres user, then switches to it with gosu.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    read_only: true
    tmpfs: [/var/run/postgresql, /tmp]
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.pem
      - -c
      - ssl_key_file=/certs/server-key.pem
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: monitorflow
      POSTGRES_DB: monitorflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - dbcerts:/certs:ro
      - ./docker/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    # PostgreSQL reads pg_hba.conf from the file it mounted at creation:
    # change this with the file, so the container is created again.
    labels:
      monitorflow.pg-hba: "2"
    networks: [storage]
    depends_on:
      db-certs: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitorflow -d monitorflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
    <<: *hardening
    # Runs as root, and reads the key and password storage-certs wrote for
    # the server's user, mode 0600.
    cap_add: [DAC_READ_SEARCH]
    read_only: true
    tmpfs: [/tmp]
    # UI_*: set by the updater for Administration > Settings (ADR-0069).
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${METRICS_RETENTION:-${UI_METRICS_RETENTION:-90d}}
      # TLS and a password (ADR-0087). The certificate is read again every
      # second: renewing it needs no restart.
      - -tls
      - -tlsCertFile=/tls/cert.pem
      - -tlsKeyFile=/tls/key.pem
      - -tlsMinVersion=TLS13
      - -httpAuth.username=monitorflow
      - -httpAuth.password=file:///tls/password
    volumes: ["vmdata:/storage", "storagetls:/tls:ro"]
    networks: [storage]
    depends_on:
      storage-certs: { condition: service_completed_successfully }
    restart: unless-stopped

  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
    <<: *hardening
    # As VictoriaMetrics.
    cap_add: [DAC_READ_SEARCH]
    read_only: true
    tmpfs: [/tmp]
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${LOGS_RETENTION:-${UI_LOGS_RETENTION:-30d}}
      # As VictoriaMetrics.
      - -tls
      - -tlsCertFile=/tls/cert.pem
      - -tlsKeyFile=/tls/key.pem
      - -tlsMinVersion=TLS13
      - -httpAuth.username=monitorflow
      - -httpAuth.password=file:///tls/password
    volumes: ["vldata:/storage", "storagetls:/tls:ro"]
    networks: [storage]
    depends_on:
      storage-certs: { condition: service_completed_successfully }
    restart: unless-stopped

  # One-shot, before every start of the server: database migrations as the
  # role that owns the schema, which also creates the server's own role and
  # gives it its rights (ADR-0109). The only service with that role.
  db-migrate:
    build: *server-build
    image: ${SERVER_IMAGE:-monitorflow-server:local}
    command: ["migrate"]
    <<: *hardening
    read_only: true
    environment:
      MONITORFLOW_DATABASE_MIGRATE_URL: "postgres://monitorflow:${POSTGRES_PASSWORD}@postgres:5432/monitorflow?sslmode=verify-full&sslrootcert=/certs/ca.pem"
      MONITORFLOW_DATABASE_URL: &database-url "postgres://monitorflow_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@postgres:5432/monitorflow?sslmode=verify-full&sslrootcert=/certs/ca.pem"
      MONITORFLOW_LOG_FORMAT: json
    volumes: ["dbcerts:/certs:ro"]
    networks: [storage]
    depends_on:
      postgres: { condition: service_healthy }

  server:
    build: *server-build
    image: ${SERVER_IMAGE:-monitorflow-server:local}
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    environment:
      # A role that owns no table and cannot change the schema (ADR-0109).
      MONITORFLOW_DATABASE_URL: *database-url
      MONITORFLOW_DATABASE_REQUIRE_RESTRICTED_ROLE: "true"
      <<: *storage-tls
      # Reached by the web service only: the port is not published (ADR-0006).
      MONITORFLOW_API_LISTEN_ADDR: 0.0.0.0:7444
      MONITORFLOW_SERVER_NAMES: ${SERVER_NAMES:?set SERVER_NAMES in .env}
      # Where the setup link points (ADR-0071).
      MONITORFLOW_WEB_URL: https://${DOMAIN:?set DOMAIN in .env}:${HTTPS_PORT:-443}
      MONITORFLOW_LOG_FORMAT: json
      # Unset: the latest GitHub release (ADR-0052).
      MONITORFLOW_AGENT_DOWNLOAD_URL: ${AGENT_DOWNLOAD_URL:-}
      # Server updates through the updater service (ADR-0056).
      MONITORFLOW_SERVER_UPDATE_DIR: /var/lib/monitorflow/update
      MONITORFLOW_RELEASE_URL: ${RELEASE_URL:-}
      # The updater's backups, for downloads (ADR-0058).
      MONITORFLOW_BACKUP_DIR: /var/lib/monitorflow/backups
      # Unset: chosen in the web interface, github by default (ADR-0054).
      MONITORFLOW_AGENT_INSTALL_SOURCE: ${AGENT_INSTALL_SOURCE:-}
      # The ports published below, for the install commands of new tokens.
      MONITORFLOW_GRPC_PUBLIC_PORT: ${GRPC_PORT:-7443}
      MONITORFLOW_ENROLL_PUBLIC_PORT: ${ENROLL_PORT:-7445}
      # What agents and relays download packages from (ADR-0067): the
      # default of Administration > Settings, which MIRROR_PUBLIC_URL locks
      # (ADR-0069).
      MONITORFLOW_MIRROR_DEFAULT_URL: http://${DOMAIN}:${MIRROR_PORT:-7480}
      MONITORFLOW_MIRROR_PUBLIC_URL: ${MIRROR_PUBLIC_URL:-}
      # Unset: chosen in Administration > Settings (ADR-0069).
      MONITORFLOW_API_SESSION_LIFETIME: ${SESSION_LIFETIME:-}
      MONITORFLOW_API_SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-}
    volumes:
      - serverdata:/var/lib/monitorflow/server
      - mirrors:/var/lib/monitorflow/server/mirrors
      - dbcerts:/certs:ro
      - storagetls:/var/lib/monitorflow/storage-tls
      # Requests go to its inbox; the rest belongs to the updater.
      - update:/var/lib/monitorflow/update
      - ${BACKUP_DIR:-backups}:/var/lib/monitorflow/backups:ro
    networks: [storage, front]
    ports:
      - "${GRPC_PORT:-7443}:7443"
      - "${ENROLL_PORT:-7445}:7445"
      # Signed public packages only, plain on purpose (ADR-0030).
      - "${MIRROR_PORT:-7480}:7480"
    depends_on:
      postgres: { condition: service_healthy }
      db-migrate: { condition: service_completed_successfully }
      victoriametrics: { condition: service_started }
      victorialogs: { condition: service_started }
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/7444 && printf 'GET /api/health/ready HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot, before every start of web: gives Caddy's data to the user
  # web runs as. It was root's before ADR-0110.
  web-data:
    build: *web-build
    image: ${WEB_IMAGE:-monitorflow-web:local}
    entrypoint: ["chown"]
    command: ["-R", "10002:10002", "/data"]
    user: "0"
    <<: *hardening
    # DAC_READ_SEARCH: Caddy's directories are its own, mode 0700.
    cap_add: [CHOWN, DAC_READ_SEARCH]
    read_only: true
    network_mode: none
    volumes: ["caddydata:/data"]

  # Caddy as its own user, on ports 80 and 443 of the container's network
  # namespace, which the sysctl opens to it (ADR-0110). The user is set
  # here, not in the image: an update recreates web from the image of the
  # release before the compose file of that release is in place.
  web:
    build: *web-build
    image: ${WEB_IMAGE:-monitorflow-web:local}
    user: "10002:10002"
    <<: *hardening
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    read_only: true
    # The trust page and Caddy's autosaved configuration, written at start.
    tmpfs:
      - /srv/monitorflow/run:uid=10002,gid=10002
      - /config:uid=10002,gid=10002
      - /tmp
    environment:
      MONITORFLOW_DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      MONITORFLOW_API_UPSTREAM: server:7444
      # acme or internal, chosen by the installer (ADR-0068).
      MONITORFLOW_CERTIFICATE: ${WEB_CERTIFICATE:-acme}
      MONITORFLOW_HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes: ["caddydata:/data"]
    networks: [front]
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    depends_on:
      server: { condition: service_healthy }
      web-data: { condition: service_completed_successfully }
    restart: unless-stopped

  # Runs aptly, reposync, createrepo_c and gpg for the server, which asks
  # through a socket in the mirrors volume (ADR-0067). No listener, no
  # database, and only the mirrors volume: the server's keys stay away from
  # tools that parse what they download.
  mirror:
    build:
      context: ..
      dockerfile: deploy/docker/mirror.Dockerfile
    image: ${MIRROR_IMAGE:-monitorflow-mirror:local}
    # Not read-only: dnf, run by another user than root, keeps its metadata
    # cache in /var/tmp whatever cachedir says, and a tmpfs there would
    # hold it in memory (ADR-0110).
    <<: *hardening
    volumes: ["mirrors:/var/lib/monitorflow/server/mirrors"]
    networks: [mirror]
    healthcheck:
      test: ["CMD", "test", "-S", "/var/lib/monitorflow/server/mirrors/tools/tools.sock"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Installs releases when the server asks (ADR-0056) and backs up the
  # database and serverdata every day (ADR-0058). The only service with
  # the Docker socket; it has no listener.
  updater:
    build:
      context: ..
      dockerfile: deploy/docker/updater.Dockerfile
    image: ${UPDATER_IMAGE:-monitorflow-updater:local}
    <<: *hardening
    # Root, as the Docker socket is root's anyway (which makes these
    # limits a guard against mistakes more than a boundary): it backs up
    # and restores the server's data, owned by the server's user, and
    # keeps the owners of the files it writes. FSETID keeps the setgid bit
    # of the backups directory, which lets the server's group read them.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, FSETID]
    environment:
      # Unset: agent_download_url's release, GitHub's by default.
      MONITORFLOW_RELEASE_URL: ${RELEASE_URL:-}
      MONITORFLOW_AGENT_DOWNLOAD_URL: ${AGENT_DOWNLOAD_URL:-}
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # This directory: the compose files and .env, where it pins images.
      - .:/deploy
      - update:/var/lib/monitorflow/update
      - updater:/var/lib/monitorflow/updater
      - ${BACKUP_DIR:-backups}:/backups
      # Saved in backups, written back by deploy/restore.sh.
      - serverdata:/serverdata
      # The mirror signing key is in backups, the repositories are not.
      - mirrors:/serverdata/mirrors
    restart: unless-stopped

networks:
  # The databases: no published port, no route out (ADR-0051), and TLS
  # to each (ADR-0087).
  storage:
    internal: true
  front:
  # The mirror tools reach upstreams, and nothing of the stack.
  mirror:

volumes:
  dbcerts:
  # The stores' certificate, key and password; issued again if lost.
  storagetls:
  pgdata:
  vmdata:
  vldata:
  # Holds the CA: losing it means enrolling every agent again. In backups.
  serverdata:
  # Package repositories, snapshots and their signing key, shared by the
  # server and the mirror tools. Tens to hundreds of GB once in use.
  mirrors:
  caddydata:
  # Requests and status of server updates, shared by server and updater.
  update:
  # The updater's own state: what to roll back to.
  updater:
  # Daily backups and those before each update, the 7 newest kept, unless
  # BACKUP_DIR is set. They hold the CA keys: protect copies.
  backups:

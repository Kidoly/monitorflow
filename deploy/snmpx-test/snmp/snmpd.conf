# net-snmp for the custom SNMP test (ADR-0157): v1, v2c and v3, read-only.
# A table under net-snmp's playground (netSnmpPlaypen) comes from
# table.sh, which reads rows the test changes. Test credentials only.
agentAddress udp:161
rocommunity e2e-community default
createUser e2e-sha256 SHA-256 "e2e-auth-password" AES "e2e-priv-password"
rouser e2e-sha256 priv
sysName jobs-e2e
sysLocation test
sysContact test
pass .1.3.6.1.4.1.8072.9999.9999 /bin/sh /conf/table.sh

# Network clients must use TLS (ADR-0051). The local socket serves the
# image's initialisation, its health check and the updater's backups.
# From the network, the server's role reaches its database from anywhere,
# and the role that owns the schema only from the Docker networks this
# container is on, where db-migrate runs (ADR-0109). After a change, change
# the monitorflow.pg-hba label of the postgres service too.
local    all          all                       trust
hostssl  monitorflow  monitorflow_app  all      scram-sha-256
hostssl  all          monitorflow      samenet  scram-sha-256

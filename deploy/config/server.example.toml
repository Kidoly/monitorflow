# MonitorFlow central server configuration.
# Default path: /etc/monitorflow/server.toml (override with --config or MONITORFLOW_CONFIG).
# Every key can be overridden by an environment variable: MONITORFLOW_ plus the
# key in upper case, nested keys joined by "_" (log.level -> MONITORFLOW_LOG_LEVEL).
# Commented-out keys show their default.

# gRPC listener for agents and relays (mTLS).
# grpc_listen_addr = "0.0.0.0:7443"

# Enrollment listener (TLS without client certificates, ADR-0007). New agents
# and relays exchange their one-time token for a certificate here.
# enroll_listen_addr = "0.0.0.0:7445"

# REST API listener. Plain HTTP: put a TLS reverse proxy on the same host in
# front of it and keep it on loopback (ADR-0006).
# api_listen_addr = "127.0.0.1:7444"

# Send the session cookie with the Secure attribute. Only disable for local
# development over plain HTTP.
# api_cookie_secure = true

# Session lifetime and idle timeout, in seconds (12 hours, 30 minutes).
# api_session_lifetime = 43200
# api_session_idle_timeout = 1800

# PostgreSQL connection. Required. The password is redacted in logs; prefer
# MONITORFLOW_DATABASE_URL so it does not stay on disk.
database_url = "postgres://monitorflow:change-me@localhost:5432/monitorflow"

# Time series and log storage. http is accepted for development.
# victoriametrics_url = "http://localhost:8428"
# victorialogs_url = "http://localhost:9428"

# Certificate authority, command signing key, mirrors.
# data_dir = "/var/lib/monitorflow/server"

# Seconds without any message from an agent or relay before its stream is
# closed. Keep it a few times the agents' heartbeat_interval (default 30).
# heartbeat_timeout = 90

# Names peers use to reach this server. The built-in CA writes them in the
# server certificate it issues to itself on first start.
# server_names = ["localhost", "127.0.0.1"]

# Batching of writes to VictoriaMetrics and VictoriaLogs (ADR-0013). Each
# writer has its own queue; while a queue is full, new items are dropped and
# counted, so a slow backend never stalls agent streams.
[ingest]
# Most samples or log lines per HTTP request.
# batch_size = 5000
# Milliseconds between flushes of a partial batch.
# flush_interval_ms = 1000
# Items held in memory per writer, at least batch_size.
# queue_capacity = 100000
# Seconds allowed at shutdown to flush the queues.
# shutdown_timeout = 10

# Created by the server from its built-in CA when missing, renewed at start
# when close to expiry. A certificate from another CA is refused.
[tls]
# ca_cert = "/etc/monitorflow/tls/ca.pem"
# cert = "/etc/monitorflow/tls/cert.pem"
# key = "/etc/monitorflow/tls/key.pem"

[log]
# trace, debug, info, warn or error.
# level = "info"
# text or json; use json in production.
# format = "text"

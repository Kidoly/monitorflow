# MonitorFlow central server configuration.
# Default path: /etc/monitorflow/server.toml (override with --config or MONITORFLOW_CONFIG).
# Every key can be overridden by an environment variable: MONITORFLOW_ plus the
# key in upper case, nested keys joined by "_" (log.level -> MONITORFLOW_LOG_LEVEL).
# Commented-out keys show their default.

# gRPC listener for agents and relays (mTLS).
# grpc_listen_addr = "0.0.0.0:7443"

# Enrollment listener (TLS without client certificates, ADR-0007). New agents
# and relays exchange their one-time token for a certificate here.
# enroll_listen_addr = "0.0.0.0:7445"

# REST API listener. Plain HTTP: put a TLS reverse proxy on the same host in
# front of it and keep it on loopback (ADR-0006).
# api_listen_addr = "127.0.0.1:7444"

# Send the session cookie with the Secure attribute. Only disable for local
# development over plain HTTP.
# api_cookie_secure = true

# Session lifetime and idle timeout, in seconds (12 hours, 30 minutes).
# api_session_lifetime = 43200
# api_session_idle_timeout = 1800

# PostgreSQL connection. Required. The password is redacted in logs; prefer
# MONITORFLOW_DATABASE_URL so it does not stay on disk.
database_url = "postgres://monitorflow:change-me@localhost:5432/monitorflow"

# Time series and log storage. http is accepted for development.
# victoriametrics_url = "http://localhost:8428"
# victorialogs_url = "http://localhost:9428"

# Certificate authority (<data_dir>/ca/), the server's own certificate
# (<data_dir>/tls/ unless [tls] says otherwise), command signing key, mirrors.
# data_dir = "/var/lib/monitorflow/server"

# Seconds without any message from an agent or relay before its stream is
# closed. Keep it a few times the agents' heartbeat_interval (default 30).
# heartbeat_timeout = 90

# Names peers use to reach this server. The built-in CA writes them in the
# server certificate it issues to itself on first start.
# server_names = ["localhost", "127.0.0.1"]

# Package mirrors (ADR-0030). Plain HTTP on purpose: apt and dnf check the
# content by its signatures. Serves /apt/, /dnf/ and /keys/ from mirror_dir.
# mirror_listen_addr = "0.0.0.0:7480"
# mirror_dir = "/var/lib/monitorflow/server/mirrors"
# URL agents reach the listener above at, written into their package sources
# by source configuration commands (ADR-0035); unset refuses those commands.
# mirror_public_url = "http://mirror.example.net:7480"

# https URL of a directory holding the agent release files (install.sh,
# SHA256SUMS, the binaries), used in the install commands the web interface
# shows with a new token (ADR-0052). Set it when the site serves the files
# itself: it is then the `custom` install source (ADR-0054), and the
# fallback of self-updates.
# agent_download_url = "https://github.com/Kidoly/monitorflow/releases/latest/download"
# Default source of those install commands: github, central (this server's
# release cache, at https://<web interface>/agent/) or custom
# (agent_download_url). Unset, administrators choose it in the web
# interface; github unless agent_download_url is set.
# agent_install_source = "github"

# Server updates from the web interface (ADR-0056). server_update_dir is
# the volume shared with the updater container; unset, updates are off.
# release_url is where releases are checked, http or https, signed either
# way; agent_download_url when unset.
# server_update_dir = "/var/lib/monitorflow/update"
# release_url = "https://files.example.com/monitorflow"

# Batching of writes to VictoriaMetrics and VictoriaLogs (ADR-0013). Each
# writer has its own queue; while a queue is full, new items are dropped and
# counted, so a slow backend never stalls agent streams.
[ingest]
# Most samples or log lines per HTTP request.
# batch_size = 5000
# Milliseconds between flushes of a partial batch.
# flush_interval_ms = 1000
# Items held in memory per writer, at least batch_size.
# queue_capacity = 100000
# Seconds allowed at shutdown to flush the queues.
# shutdown_timeout = 10

# Created by the server from its built-in CA when missing, renewed at start
# when close to expiry. A certificate from another CA is refused. Each unset
# path defaults to a file under <data_dir>/tls/, so it follows data_dir.
[tls]
# ca_cert = "/var/lib/monitorflow/server/tls/ca.pem"
# cert = "/var/lib/monitorflow/server/tls/cert.pem"
# key = "/var/lib/monitorflow/server/tls/key.pem"

# Tools run by mirror syncs and snapshots, looked up on PATH unless absolute.
[mirror]
# aptly = "aptly"
# reposync = "reposync"
# createrepo_c = "createrepo_c"
# gpg = "gpg"
# Seconds one command may run before it is killed (12 hours).
# sync_timeout = 43200
# Scheduled syncs running at once.
# max_concurrent_syncs = 2

# AI-driven remediation (ADR-0039). Off by default. The AI only proposes
# commands; each one is risk-classified by rules and approved as configured.
[ai]
# enabled = false
# Only "claude" (Anthropic Messages API) for now.
# provider = "claude"
# File holding the API key alone, readable by the server only. Required when
# enabled. Never put the key itself in this file.
# api_key_file = "/etc/monitorflow/ai-api-key"
# model = "claude-opus-5-5"
# Most tokens one answer may use, thinking included.
# max_tokens = 16000
# Seconds one request to the API may take; answers can take minutes.
# request_timeout = 300

[remediation]
# Limits of each AI remediation incident (ADR-0043), which opens for every
# new threshold incident while [ai] is enabled. Hitting one hands the
# incident to a human. Read-only commands run automatically; others wait
# for approval or are refused, by the rules of ADR-0041 only.
# Most commands run for one incident.
# max_commands = 10
# Seconds from opening to escalation, waiting for approval included.
# max_duration = 1800
# Seconds one command may take from queueing to its result (at most 3600).
# command_timeout = 120

# Proxmox VE VM snapshots before change-tier remediation commands
# (ADR-0044). Off by default. Map servers to VMs with
# PUT /api/servers/{id}/proxmox; servers without a mapping run commands
# with limited rollback.
[proxmox]
# enabled = false
# Snapshots kept per VM; older ones MonitorFlow took are deleted. Snapshots
# made by anyone else are never touched.
# keep_snapshots = 3
# Seconds one HTTP request may take.
# request_timeout = 30
# Seconds a snapshot, rollback or deletion task may run.
# task_timeout = 600

# One entry per cluster; any node's API URL works. The token needs
# VM.Snapshot, VM.Snapshot.Rollback and VM.Audit on the mapped VMs.
# [[proxmox.clusters]]
# name = "pve"
# url = "https://pve1.example.net:8006"
# token_id = "monitorflow@pve!snapshots"
# File holding the token secret alone, readable by the server only. Never
# put the secret itself in this file.
# token_secret_file = "/etc/monitorflow/proxmox-pve.secret"
# CA certificates (PEM) trusted for this cluster instead of the public
# roots, like a copy of /etc/pve/pve-root-ca.pem. Certificates are always
# verified.
# ca_file = "/etc/monitorflow/proxmox-pve-ca.pem"

[log]
# trace, debug, info, warn or error.
# level = "info"
# text or json; use json in production.
# format = "text"


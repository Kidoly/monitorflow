# MonitorFlow agent configuration for Windows (ADR-0047).
# Default path: C:\ProgramData\MonitorFlow\agent.toml (override with --config
# or MONITORFLOW_CONFIG). Every key can be overridden by an environment
# variable: MONITORFLOW_ plus the key in upper case, nested keys joined by "_"
# (log.level -> MONITORFLOW_LOG_LEVEL). Commented-out keys show their default
# when %ProgramData% is C:\ProgramData. Use single quotes for paths, so
# backslashes stay as they are.

# gRPC endpoint of a relay or the central server. Required. Must be https:
# every link is mTLS.
upstream_url = "https://relay.example.com:7443"

# Enrollment endpoint of the central server, used on the first run only.
# Defaults to the host of upstream_url on port 7445. Set it when the upstream
# is a relay.
# enroll_url = "https://monitorflow.example.com:7445"

# Local state: identity, sensor configuration, command journal, and the
# service's logs in logs\agent.log. Only the service account, SYSTEM and
# Administrators may read it; see docs/deploy-agent.md.
data_dir = 'C:\ProgramData\MonitorFlow\agent'

# One-time enrollment token from the web interface. Only needed on the first
# run; remove it once the agent is enrolled. This file is readable by the
# service and administrators only.
# enrollment_token = ""

# Seconds between heartbeats. Must be greater than zero.
# heartbeat_interval = 30

[tls]
# PEM files of the mTLS identity, written by enrollment. Default to files in
# <data_dir>\tls\.
# ca_cert = 'C:\ProgramData\MonitorFlow\agent\tls\ca.pem'
# cert = 'C:\ProgramData\MonitorFlow\agent\tls\cert.pem'
# key = 'C:\ProgramData\MonitorFlow\agent\tls\key.pem'

[log]
# trace, debug, info, warn or error.
# level = "info"
# text or json. As a service, logs go to <data_dir>\logs\agent.log, which
# moves to agent.log.1 at 16 MiB.
# format = "text"

[sensors]
# Limits on what the sensors configured by the server may touch on this host.
# The server cannot change them (ADR-0024).
#
# Directory of the scripts the `script` sensor may run.
script_dir = 'C:\ProgramData\MonitorFlow\scripts.d'

# Event Log channels the `eventlog` sensor may read (ADR-0048). Match
# counts of `Security` reveal logon activity; add it deliberately. An empty
# list disables the sensor.
# event_channels = ["Application", "System"]

# Folders the `log` sensor may read files under (ADR-0085). A server
# configuration names a file; it is read only if it resolves, links
# included, under one of these. Only match counts go upstream, but a
# pattern still reveals whether matching lines exist, so keep this to logs
# the monitoring admins may see. Empty by default: list your applications'
# log folders, and give NT SERVICE\MonitorFlowAgent read access to them.
# log_dirs = ['D:\Logs\MyApp']

[commands]
# Run the commands of AI remediation in Windows PowerShell 5.1 as the
# agent's account (ADR-0084). `monitorflow-agent.exe ai-commands on|off`
# sets it.
# shell = false
# Let administrators turn `shell` on and off from the server's page in
# the web interface (ADR-0098). Without it the web interface can only turn
# it off. `monitorflow-agent.exe ai-commands from-web on|off` sets it.
# from_web = false

[plugins]
# Run the check plugins the central server gives this machine (ADR-0103):
# WebAssembly modules in a sandbox with no file, program or network
# access except HTTP to the hosts each plugin lists, run only when the
# server granted them with its command key. On unless turned off here.
# checks = true
# Run only plugins signed with MonitorFlow's own key, not those of
# publishers your administrators trust.
# official_only = false

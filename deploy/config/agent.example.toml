# MonitorFlow agent configuration.
# Default path: /etc/monitorflow/agent.toml (override with --config or MONITORFLOW_CONFIG).
# Every key can be overridden by an environment variable: MONITORFLOW_ plus the
# key in upper case, nested keys joined by "_" (log.level -> MONITORFLOW_LOG_LEVEL).
# Commented-out keys show their default.

# gRPC endpoint of a relay or the central server. Required. Must be https:
# every link is mTLS.
upstream_url = "https://relay.example.com:7443"

# Enrollment endpoint of the central server, used on the first run only.
# Defaults to the host of upstream_url on port 7445. Set it when the upstream
# is a relay.
# enroll_url = "https://monitorflow.example.com:7445"

# Local state: identity, sequence numbers, pending samples.
# data_dir = "/var/lib/monitorflow/agent"

# One-time enrollment token from the web interface. Only needed on the first
# run; prefer MONITORFLOW_ENROLLMENT_TOKEN so it does not stay on disk, and
# remove it once the agent is enrolled.
# enrollment_token = ""

# Seconds between heartbeats. Must be greater than zero.
# heartbeat_interval = 30

[tls]
# PEM files of the mTLS identity, written by enrollment. Default to files in
# <data_dir>/tls/.
# ca_cert = "/var/lib/monitorflow/agent/tls/ca.pem"
# cert = "/var/lib/monitorflow/agent/tls/cert.pem"
# key = "/var/lib/monitorflow/agent/tls/key.pem"

[log]
# trace, debug, info, warn or error.
# level = "info"
# text or json.
# format = "text"

[sensors]
# Limits on what the sensors configured by the server may touch on this host.
# The server cannot change them (ADR-0024).
#
# Directory of the scripts the `script` sensor may run. A server
# configuration only names a script in it. The directory and each script
# must be owned by root (or the agent's user) and not writable by group or
# other; scripts must start with "#!" or be ELF binaries. Install one with:
#   install -o root -g root -m 0755 check_backup /etc/monitorflow/scripts.d/
# script_dir = "/etc/monitorflow/scripts.d"

# MonitorFlow agent configuration.
# Default path: /etc/monitorflow/agent.toml (override with --config or MONITORFLOW_CONFIG).
# Every key can be overridden by an environment variable: MONITORFLOW_ plus the
# key in upper case, nested keys joined by "_" (log.level -> MONITORFLOW_LOG_LEVEL).
# Commented-out keys show their default.

# gRPC endpoint of a relay or the central server. Required. Must be https:
# every link is mTLS.
upstream_url = "https://relay.example.com:7443"

# Enrollment endpoint of the central server, used on the first run only.
# Defaults to the host of upstream_url on port 7445. Set it when the upstream
# is a relay.
# enroll_url = "https://monitorflow.example.com:7445"

# Local state: identity, sequence numbers, pending samples.
# data_dir = "/var/lib/monitorflow/agent"

# One-time enrollment token from the web interface. Only needed on the first
# run; prefer MONITORFLOW_ENROLLMENT_TOKEN so it does not stay on disk, and
# remove it once the agent is enrolled.
# enrollment_token = ""

# Seconds between heartbeats. Must be greater than zero.
# heartbeat_interval = 30

[tls]
# PEM files of the mTLS identity, written by enrollment. Default to files in
# <data_dir>/tls/.
# ca_cert = "/var/lib/monitorflow/agent/tls/ca.pem"
# cert = "/var/lib/monitorflow/agent/tls/cert.pem"
# key = "/var/lib/monitorflow/agent/tls/key.pem"

[log]
# trace, debug, info, warn or error.
# level = "info"
# text or json.
# format = "text"

[sensors]
# Limits on what the sensors configured by the server may touch on this host.
# The server cannot change them (ADR-0024).
#
# Directory of the scripts the `script` sensor may run. A server
# configuration only names a script in it. The directory and each script
# must be owned by root (or the agent's user) and not writable by group or
# other; scripts must start with "#!" or be ELF binaries. Install one with:
#   install -o root -g root -m 0755 check_backup /etc/monitorflow/scripts.d/
# script_dir = "/etc/monitorflow/scripts.d"

# Whether a server configuration may pass arguments to those scripts: "none"
# refuses a script sensor with arguments, "any" passes them (plain words,
# at most 8). Arguments steer what a script does, and some packaged Nagios
# plugins run them as a command, so allow them only if every script in
# script_dir treats them as untrusted. Link plugins in one by one; never
# point script_dir at /usr/lib/nagios/plugins. negate, urlize and
# check_by_ssh are never run, whatever this says (ADR-0112).
# script_args = "none"

# Directories the `log` sensor may read files under. A server configuration
# names a file; it is read only if it resolves, symlinks included, under one
# of these. Only match counts go upstream, but a pattern still reveals
# whether matching lines exist, so keep this to logs the monitoring admins
# may see. An empty list disables the log sensor. Where each log sensor
# stopped is kept under data_dir, so a restart resumes there (ADR-0085).
# log_dirs = ["/var/log"]

# Windows: Event Log channels the `eventlog` sensor may read (ADR-0048).
# Match counts of `Security` reveal logon activity; add it deliberately.
# An empty list disables the sensor.
# event_channels = ["Application", "System"]

# Where port checks and website checks may connect (ADR-0111, ADR-0150);
# a website check's redirects too. Unset, the default: anywhere the
# central server names, as before. Set it to limit what a compromised
# central server could probe from this machine's network. Entries are
# address ranges (CIDR) or addresses, and host names, each with an optional
# port or port range; IPv6 with ports in brackets. A listed host name may
# connect to whatever it resolves to; any other host name only to the
# addresses it resolves to inside a range listed for its port. An empty
# list disables port checks. Website checks and the requests of plugin
# checks follow the same list. The agent does not start with an
# unreadable entry.
# port_targets = ["127.0.0.1", "10.0.0.0/8:22", "192.168.0.0/16:8000-8999",
#                 "[fd00::/8]:443", "db.example.com:5432"]

[packages]
# Seconds between two reports of the installed packages and the reboot
# state; one is also sent at start and after every update (ADR-0031).
# Updates run apt-get or dnf through `sudo -n` with the command lines
# listed in ADR-0031, which the sudoers rules must allow.
# report_interval = 21600
# "Allow major upgrades from the web interface" (ADR-0182): let the
# central server move this host to the next release of its distribution,
# Debian 12 to 13 for now, through the root helper `major-upgrade`. Off
# unless enabled here; the installer's MF_MAJOR_UPGRADES_FROM_WEB and
# `monitorflow-agent major-upgrades on|off` set it.
# major_upgrades = false

[commands]
# Run the `shell` commands of the AI remediation loop (ADR-0043): single
# command lines the server's risk rules classified as read-only, or that an
# approver accepted, run with /bin/sh -c as the agent's user, environment
# reset to PATH and LC_ALL=C. Off unless enabled here or, with
# `from_web`, from the web interface. The installer's MF_ALLOW_COMMANDS
# sets it.
# shell = false
# Let administrators turn `shell` on and off from the server's page in
# the web interface (ADR-0098). Without it the web interface can only turn
# it off. The installer's MF_AI_COMMANDS_FROM_WEB sets it.
# from_web = false
# Let AI commands ask for the root actions of ADR-0181: clearing the
# package cache, vacuuming the journal, pruning unused Docker images,
# restarting a service. The agent's root helper runs them through one sudo
# line, and reads this key from this file itself. The Linux installer sets
# it on a new install unless MF_AI_ROOT_ACTIONS=0; `monitorflow-agent
# ai-commands root-actions on|off` changes it.
# root_actions = false
# Run scripts of the central server's script library (ADR-0189), with
# /bin/sh -c as the agent's user, never as root. Off unless enabled here;
# the web interface cannot turn it on. The installer's MF_ALLOW_SCRIPTS
# sets it.
# scripts = false
# Let the central server install and remove software from its catalogue
# (ADR-0188). Windows only for now: `monitorflow-agent.exe software on`
# or the MSI property SOFTWARE_FROM_WEB=1 sets it. The update service,
# which installs as LocalSystem, reads it here too.
# software = false

[remote]
# Let people of the roles the central server allows open a terminal on
# this host from its page in the web interface (ADR-0190), through the
# agent's connection, as the agent's own user. The installer's
# MF_REMOTE_TERMINAL and `monitorflow-agent remote-access terminal on|off`
# set it; restart the agent after editing it by hand.
# terminal = false
# The local account terminals run as, on Linux, instead of the agent's
# user: a root helper checks each signed command, then starts that
# account's login shell. Never root unless named here. The installer's
# MF_REMOTE_TERMINAL_USER and `remote-access terminal-user` set it.
# terminal_user = "ops"
# Windows: let them open this host's desktop too, through its own Remote
# Desktop service on 127.0.0.1:3389 and nothing else (ADR-0190). A consent
# of its own: the MSI's REMOTE_DESKTOP=1 and `monitorflow-agent.exe
# remote-access desktop on|off` set it. Remote Desktop must be turned on in
# Windows; no port opens.
# desktop = false

[plugins]
# Run the check plugins the central server gives this machine (ADR-0103):
# WebAssembly modules in a sandbox with no file, program or network
# access except HTTP to the hosts each plugin lists, run only when the
# server granted them with its command key. On unless turned off here.
# checks = true
# Run only plugins signed with MonitorFlow's own key, not those of
# publishers your administrators trust.
# official_only = false

# MonitorFlow relay configuration (ADR-0025).
# Default path: /etc/monitorflow/relay.toml (override with --config or MONITORFLOW_CONFIG).
# Every key can be overridden by an environment variable: MONITORFLOW_ plus the
# key in upper case, nested keys joined by "_" (log.level -> MONITORFLOW_LOG_LEVEL).
# Commented-out keys show their default.

# gRPC listener for agents (mTLS). Agents set their upstream_url to this
# address, under one of the names given with --server-name to the relay's
# enrollment token.
# listen_addr = "0.0.0.0:7443"

# gRPC endpoint of the central server. Required. Must be https.
upstream_url = "https://monitorflow.example.com:7443"

# Enrollment endpoint of the server. Defaults to the host of upstream_url on
# port 7445.
# enroll_url = "https://monitorflow.example.com:7445"

# One-time relay token, only for the first run. Create it on the server with
#   monitorflow-server token create --role relay --id <relay id> --site <site> \
#     --server-name <name agents use> [--server-name ...]
# Prefer MONITORFLOW_ENROLLMENT_TOKEN, and remove it once enrolled.
# enrollment_token = "mfe1...."

# Identity files, the store-and-forward buffer (<data_dir>/buffer) and the
# mirror copies (<data_dir>/mirrors).
# data_dir = "/var/lib/monitorflow/relay"

# Seconds between heartbeats on the relay's own stream to the server.
# heartbeat_interval = 30

[buffer]
# Store-and-forward (ADR-0027): agents' sample batches are kept on disk while
# the upstream is unreachable, and sent in order once it is back.
# Total size on disk; when full, the oldest records are dropped (1 GiB).
# max_bytes = 1073741824
# Seconds a record is kept, at most 7 days: the server drops older samples.
# max_age = 604800
# Milliseconds between syncs to disk; a crash loses at most this much of the
# buffer. 0 syncs after every record.
# fsync_interval_ms = 1000

# Plain HTTP listener serving the relay's copy of the package mirrors
# (ADR-0034), only when [mirror] is enabled. Public, signed packages only;
# agents check the signatures. Agents behind this relay use
# http://<relay>:7480/apt/<mirror>/current/ or /dnf/<mirror>/current/.
# Must not collide with another listener on this host, such as the server's
# own mirror listener.
# mirror_listen_addr = "0.0.0.0:7480"

# Root of the mirror copies, laid out as apt/, dnf/ and keys/. Defaults to
# <data_dir>/mirrors.
# mirror_dir = "/var/lib/monitorflow/relay/mirrors"

[mirror]
# Copy the upstream's mirrors and serve them (ADR-0034). Off by default: a
# relay holds several snapshots of every mirror, often tens of GB. If the
# listener or the mirror directory cannot be set up, the relay logs an
# error and keeps forwarding agents without mirrors.
# enabled = false
# Mirror listener of the upstream (the server, or the parent relay of a
# chained relay), http or https. Defaults to the host of upstream_url on
# port 7480.
# upstream_url = "http://monitorflow.example.com:7480"
# URL the hosts of this relay's agents reach mirror_listen_addr at, http or
# https. Reported to the server, which then points those hosts' package
# sources here instead of at its own mirror_public_url (ADR-0037). Unset,
# they keep the server's.
# public_url = "http://relay.example.com:7480"
# Seconds between syncs, at least 60.
# sync_interval = 900
# Mirror names to copy, like ["debian", "rocky9"]; empty copies every mirror
# the upstream lists.
# MONITORFLOW_MIRROR_MIRRORS takes a comma-separated list.
# mirrors = []
# Snapshots kept per mirror, including the current one, at least 1.
# keep_snapshots = 3
# Files downloaded at once, 1 to 64.
# max_downloads = 4
# Seconds a request may go without progress.
# request_timeout = 600

[tls]
# Written by enrollment; each unset path defaults under data_dir.
# ca_cert = "/var/lib/monitorflow/relay/tls/ca.pem"
# cert = "/var/lib/monitorflow/relay/tls/cert.pem"
# key = "/var/lib/monitorflow/relay/tls/key.pem"

[log]
# trace, debug, info, warn or error.
# level = "info"
# text or json.
# format = "text"

# A throwaway Zabbix for the dependency test's import (ADR-0152), in local
# Docker only, apart from the import test's (different names and port).
# zabbix.sh starts it, configures it through the API and imports it.
#
#   docker compose -f deploy/dependency-test/zabbix-compose.yml down -v
name: mf-dep-zbx

services:
  postgres:
    image: postgres:16-alpine
    container_name: mf-dep-zbx-postgres
    environment:
      POSTGRES_USER: zabbix
      # A throwaway database reachable only inside this compose network.
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix"]
      interval: 5s
      retries: 30

  server:
    image: zabbix/zabbix-server-pgsql:ubuntu-7.0-latest
    container_name: mf-dep-zbx-server
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.0-latest
    container_name: mf-dep-zbx-web
    environment:
      ZBX_SERVER_HOST: server
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
      PHP_TZ: UTC
    ports:
      - "127.0.0.1:28080:8080"
    depends_on:
      - server

volumes:
  db:

# net-snmp for the discovery test (ADR-0154): SNMP v3 only, with the user a
# device of the test's site has, so the scan finds it with the site's
# credentials. Test credentials only.
agentAddress udp:161
createUser e2e-scan SHA-256 "e2e-auth-password" AES "e2e-priv-password"
rouser e2e-scan priv
sysName files-e2e
sysDescr Linux files-e2e, a file server for the discovery test
sysLocation test
sysContact test

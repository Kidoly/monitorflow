# An additional central server (ADR-0100), written by
# `install-server.sh --join`: the server and the web interface only, on the
# database and the metric and log stores of the first central server at
# FIRST_ADDRESS. They are reached under their usual names, so their
# certificates verify as they are. Backups, updates and package mirrors
# stay on the first central server; run the installer again here after
# updating it.
name: monitorflow

# As in docker-compose.yml (ADR-0110).
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  server:
    image: ${SERVER_IMAGE:?set SERVER_IMAGE in .env}
    # The name this central server is added under, on the License page.
    hostname: ${INSTANCE_NAME:?set INSTANCE_NAME in .env}
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    environment:
      # The server's own role, which cannot change the schema: the first
      # central server migrates (ADR-0109).
      MONITORFLOW_DATABASE_URL: "postgres://monitorflow_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@postgres:5432/monitorflow?sslmode=verify-full&sslrootcert=/certs/ca.pem"
      MONITORFLOW_DATABASE_REQUIRE_RESTRICTED_ROLE: "true"
      MONITORFLOW_VICTORIAMETRICS_URL: https://victoriametrics:8428
      MONITORFLOW_VICTORIALOGS_URL: https://victorialogs:9428
      MONITORFLOW_STORAGE_TLS_DIR: /var/lib/monitorflow/storage-tls
      # Starts only with a place under the Enterprise license.
      MONITORFLOW_ADDITIONAL_INSTANCE: "true"
      MONITORFLOW_API_LISTEN_ADDR: 0.0.0.0:7444
      MONITORFLOW_SERVER_NAMES: ${SERVER_NAMES:?set SERVER_NAMES in .env}
      MONITORFLOW_WEB_URL: https://${DOMAIN:?set DOMAIN in .env}:${HTTPS_PORT:-443}
      MONITORFLOW_LOG_FORMAT: json
      MONITORFLOW_AGENT_DOWNLOAD_URL: ${AGENT_DOWNLOAD_URL:-}
      MONITORFLOW_RELEASE_URL: ${RELEASE_URL:-}
      MONITORFLOW_AGENT_INSTALL_SOURCE: ${AGENT_INSTALL_SOURCE:-}
      MONITORFLOW_GRPC_PUBLIC_PORT: ${GRPC_PORT:-7443}
      MONITORFLOW_ENROLL_PUBLIC_PORT: ${ENROLL_PORT:-7445}
      # The package mirrors are on the first central server.
      MONITORFLOW_MIRROR_DEFAULT_URL: http://${FIRST_ADDRESS}:${MIRROR_PORT:-7480}
      MONITORFLOW_MIRROR_PUBLIC_URL: ${MIRROR_PUBLIC_URL:-}
      MONITORFLOW_API_SESSION_LIFETIME: ${SESSION_LIFETIME:-}
      MONITORFLOW_API_SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-}
    extra_hosts:
      - "postgres:${FIRST_ADDRESS:?set FIRST_ADDRESS in .env}"
      - "victoriametrics:${FIRST_ADDRESS}"
      - "victorialogs:${FIRST_ADDRESS}"
    volumes:
      # The certificate authority, copied from the first central server.
      - serverdata:/var/lib/monitorflow/server
      - dbcerts:/certs:ro
      - storagetls:/var/lib/monitorflow/storage-tls
    networks: [front]
    ports:
      - "${GRPC_PORT:-7443}:7443"
      - "${ENROLL_PORT:-7445}:7445"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/7444 && printf 'GET /api/health/ready HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web-data:
    image: ${WEB_IMAGE:?set WEB_IMAGE in .env}
    entrypoint: ["chown"]
    command: ["-R", "10002:10002", "/data"]
    user: "0"
    <<: *hardening
    cap_add: [CHOWN, DAC_READ_SEARCH]
    read_only: true
    network_mode: none
    volumes: ["caddydata:/data"]

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE in .env}
    user: "10002:10002"
    <<: *hardening
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    read_only: true
    tmpfs:
      - /srv/monitorflow/run:uid=10002,gid=10002
      - /config:uid=10002,gid=10002
      - /tmp
    environment:
      MONITORFLOW_DOMAIN: ${DOMAIN}
      MONITORFLOW_API_UPSTREAM: server:7444
      MONITORFLOW_CERTIFICATE: ${WEB_CERTIFICATE:-acme}
      MONITORFLOW_HTTPS_PORT: ${HTTPS_PORT:-443}
    # The browser certificate authority, copied from the first central server.
    volumes: ["caddydata:/data"]
    networks: [front]
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    depends_on:
      server: { condition: service_healthy }
      web-data: { condition: service_completed_successfully }
    restart: unless-stopped

networks:
  front:

volumes:
  serverdata:
  dbcerts:
  storagetls:
  caddydata:

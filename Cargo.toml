[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/sensors",
    "crates/ai",
    "crates/agent",
    "crates/relay",
    "crates/server",
    "crates/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Kidoly/monitorflow"
rust-version = "1.99"

[workspace.dependencies]
monitorflow-common = { path = "crates/common" }
monitorflow-sensors = { path = "crates/sensors" }
monitorflow-ai = { path = "crates/ai" }

tokio = { version = "1", features = ["full"] }
tonic = { version = "0.13", features = ["tls-ring"] }
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-stream = { version = "0.1", features = ["net"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
# Static files of the mirror listener.
tower-http = { version = "0.6", features = ["fs"] }
percent-encoding = "2"
x509-parser = "0.18"
rcgen = "0.13"
ring = "0.17"
time = { version = "0.3", features = ["std"] }
pem = "3"
base64 = "0.22"
tempfile = "3"
axum = "0.8"
argon2 = { version = "0.5", features = ["std"] }
rpassword = "7"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
# rustls on ring, like the rest of the workspace; no OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
snap = "1"
# Relay mirror sync (ADR-0034): apt `Packages` and dnf primary metadata
# come plain, gzip, xz, bzip2 or zstd. Pure Rust, no C libraries.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.8"
# xz: lzma-rs and lzma-rust2 are the pure-Rust choices; lzma-rust2 has a
# streaming `Read` decoder, lzma-rs only decodes into a buffer.
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz"] }
# bzip2 on libbz2-rs-sys, its default pure-Rust port of libbzip2.
bzip2 = "0.6"
quick-xml = "0.38"
# CRC-32C of the relay buffer's records; already used by sqlx.
crc = "3"
# Linear-time matching for the log sensor's patterns, set by the server.
regex = "1"
# Safe syscall wrappers (statvfs, clock_gettime) for the sensors, instead
# of raw libc.
rustix = { version = "1", features = ["fs", "time"] }
# Windows agent (ADR-0047): ACLs of private files.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
